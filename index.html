417: [
    {es: "¿Te importaría recoger tus zapatos?", en: "Would you mind picking up your shoes?"},
    {es: "La fecha de renovación se ha cambiado.", en: "The renewal date has been changed."},
    {es: "Te estás saliendo por la tangente.", en: "You're going off on a tangent."},
    {es: "Se habría publicado antes si no se hubiera inundado el almacén.", en: "It would've been published sooner if the warehouse hadn't been flooded."},
    {es: "Llámame en cuanto sepas algo.", en: "Call me as soon as you know something."},
    {es: "Lo siento... lo hice sin querer.", en: "I'm sorry... I didn't mean to do it."},
    {es: "¿Te das cuenta de lo que me has hecho?", en: "Do you realise what you've done to me?"},
    {es: "¿Cómo voy a salir de este lío?", en: "How am I going to get out of this mess?"},
    {es: "Están metidos en un atasco.", en: "They're stuck in a traffic jam."},
    {es: "Si no hubieran quebrado, podríamos haber cobrado la cantidad.", en: "If they hadn't gone bankrupt, we could have collected the amount."},
    {es: "Ya es demasiado tarde.", en: "It's too late now."},
    {es: "¿Qué hacemos ahora?", en: "What shall we do now?"},
    {es: "¿Tiene alguien alguna sugerencia?", en: "Does anyone have any suggestions?"},
    {es: "Debisteis cobrarles antes.", en: "You should've collected from them sooner."},
    {es: "No nos digas lo que debimos hacer.", en: "Don't tell us what we should've done."},
    {es: "Dinos lo que debemos hacer ahora.", en: "Tell us what we should do now."},
    {es: "¿Cuál es nuestro saldo bancario?", en: "What's our bank balance?"},
    {es: "Tenemos suficiente para llegar a mayo.", en: "We have enough to get through April."},
    {es: "¿Y si alargamos las condiciones de pago?", en: "And if we lengthen the terms of payment?"},
    {es: "No les gustará a nuestros proveedores.", en: "Our suppliers won't like it."},
    {es: "Esto no es un concurso de popularidad.", en: "This isn't a popularity contest."},
    {es: "Exigirán el pago parcial.", en: "They'll demand partial payment."},
    {es: "Algunos dependen totalmente de nosotros.", en: "Some of them depend entirely on us."},
    {es: "Son en su mayoría pequeños proveedores.", en: "They're mostly small suppliers."},
    {es: "Los grandes pueden aguantar.", en: "The big ones can hold out."},
    {es: "Los pequeños se hundirán.", en: "The small ones will go under."},
    {es: "¿Podemos prorrogar la línea de crédito?", en: "Can we extend the credit line?"},
    {es: "Ya estamos hasta el cuello en deudas.", en: "We're already up to our neck in debts."},
    {es: "Esperad, se nos olvida algo.", en: "Wait, we're forgetting something."},
    {es: "Tenemos una valiosa colección de pinturas aquí mismo en la oficina.", en: "We have a valuable collection of paintings right here in the office."},
    {es: "¿Estás sugiriendo que las vendamos?", en: "Are you suggesting that we sell them?"},
    {es: "¿Qué más podemos hacer?", en: "What else can we do?"},
    {es: "No veo otra salida.", en: "I don't see any other way out."},
    {es: "¿Cuánto valen?", en: "How much are they worth?"},
    {es: "Recuerdo su valor hace 10 años.", en: "I remember their value 10 years ago."},
    {es: "Fueron tasadas por un experto.", en: "They were appraised by an expert."},
    {es: "En aquel entonces valían 3 mil millones.", en: "At that time they were worth 3 billion."},
    {es: "¿Cuánto valdrían ahora?", en: "How much would they be worth now?"},
    {es: "Depende de cómo queramos venderlos.", en: "It depends on how we want to sell them."},
    {es: "Si los subastamos conseguiremos menos.", en: "If we auction them we'll get less."},
    {es: "Si contratamos a un agente, podemos conseguir un I 5 por ciento más.", en: "If we hire an agent, we can get I 5 percent more."},
    {es: "Se tardaría más, pero ganaríamos más.", en: "It would take longer but we'd earn more."},
    {es: "¿Cuánto crees que tardaríamos?", en: "How long do you think it would take us?"},
    {es: "Podríamos deshacernos de todos ellos en un año más o menos.", en: "We could get rid of all of them in a year more or less."},
    {es: "Así podríamos saldar nuestras deudas.", en: "That way we could settle our debts."},
    {es: "Incluso podríamos pactar una buena indemnización por despido para todos.", en: "We could even negotiate good severance pay for everyone."},
    {es: "¿Cuánto nos quedaría al final?", en: "How much would we have left in the end?"},
    {es: "Aún quedaría suficiente para prepararnos un paracaídas de oro.", en: "There would still be enough left over to prepare ourselves a golden parachute."},
    {es: "¿Qué quiere decir un paracaídas de oro?", en: "What does a golden parachute mean?"},
    {es: "Significa que podemos jubilarnos ahora y vivir felices y comer perdices.", en: "It means we can retire now and live happily ever after."}
],
418: [
    {es: "Los escoceses tienen un acento extraño.", en: "The Scottish have a strange accent."},
    {es: "Tiene fama de ser tacaños.", en: "They're famous for being tight-fisted."},
    {es: "Si yo fueran zurdo, podría hacerlo.", en: "If I were left-handed, I could do it."},
    {es: "Llevaos a esa gente de aquí.", en: "Take those people away."},
    {es: "Deja que te releve.", en: "Let me take over for you."},
    {es: "Esa gente es de mente muy estrecha.", en: "Those people are very narrow-minded."},
    {es: "Primero hacemos una previsión de ventas.", en: "First we make a sales forecast."},
    {es: "Después, hacemos un plan de producción.", en: "Then we make a production plan."},
    {es: "Con estos datos elaboramos el presupuesto de gastos.", en: "With this data, we draw up the expense budget."},
    {es: "Los gastos generales se comparten.", en: "Overhead expenses are shared."},
    {es: "Se asignan a cada departamento según el número de empleados.", en: "They are allocated to each department according to the number of employees."},
    {es: "Algunos jefes de departamento se quejan de esta política.", en: "Some department heads complain about this policy."},
    {es: "Sin embargo, es la forma más justa.", en: "However, it's the fairest way."},
    {es: "Cada mes las ventas reales se comparan con las ventas estimadas.", en: "Each month actual sales are compared to estimated sales."},
    {es: "¿Y qué pasa si hay desviaciones?", en: "And what happens if there are variances?"},
    {es: "Localizamos las causas y tomamos medidas.", en: "We pinpoint the causes and take action."},
    {es: "Nuestros clientes son imprevisibles.", en: "Our customers are unpredictable."},
    {es: "Hay muchos altibajos a lo largo del año.", en: "There are a lot of ups and downs throughout the year."},
    {es: "Es un negocio estacional.", en: "It's a seasonal business."},
    {es: "La temporada alta empieza ahora.", en: "The high season is beginning now."},
    {es: "La situación de tesorería mejora en mayo.", en: "The cash situation improves in May."},
    {es: "Los míos están al lado de los de ella.", en: "Mine are next to hers."},
    {es: "El de ellos es diferente del nuestro.", en: "Theirs is different from ours."},
    {es: "¿De quién es el que está en el suelo?", en: "Whose is the one (that is) on the floor?"},
    {es: "Aquél antes era de él.", en: "That one used to be his."},
    {es: "Ya no es de él.", en: "It's not his anymore."},
    {es: "Vine para que tú me ayudaras.", en: "I came so that you could help me."},
    {es: "Trabajo para poder mantenerte.", en: "I work so that I can support you."},
    {es: "Habla alto para que todos te oigan.", en: "Speak loud so that everyone can hear you."},
    {es: "Oí una extraña voz que me asustó.", en: "I heard a strange voice that frightened me."},
    {es: "Miré atrás pero no vi nada.", en: "I looked back but I didn't see anything."},
    {es: "Miré en todas partes.", en: "I looked everywhere."},
    {es: "Por fin me di cuenta de lo que era.", en: "Finally I realised what it was."},
    {es: "El teléfono estaba descolgado.", en: "The telephone was off the hook."},
    {es: "Me acerqué (andando) al teléfono.", en: "I walked up to the telephone."},
    {es: "No pude creer lo que oía.", en: "I couldn't believe what I heard."},
    {es: "Fue una voz tan débil...", en: "It was such a weak voice..."},
    {es: "De repente me quedé helado.", en: "Suddenly I froze."},
    {es: "Era mi mujer quien me llamaba.", en: "It was my wife who was calling me."},
    {es: "Mi mujer llevaba tres años muerta.", en: "My wife had been dead for three years."},
    {es: "Colgué y casi me desmayé.", en: "I hung up and almost fainted."},
    {es: "Las llamadas seguían ocurriendo.", en: "The calls kept occurring."},
    {es: "Su voz parecía cada vez más cerca.", en: "Her voice seemed closer and closer."},
    {es: "Ya no lo podía aguantar.", en: "I couldn't stand it anymore."},
    {es: "Lentamente me estaba volviendo loco.", en: "I was slowly going crazy."},
    {es: "Decidí por fin ir al cementerio.", en: "I finally decided to go to the cemetery."},
    {es: "Me acerqué lentamente a la tumba de mi mujer, (andando)", en: "I slowly walked up to my wife's grave."},
    {es: "Había habido una tormenta la noche anterior.", en: "There had been a storm the night before."},
    {es: "Un poste telefónico había caído.", en: "A telephone pole had fallen."},
    {es: "Uno de los cables había caído justo en la tumba de mi mujer.", en: "One of the wires had fallen right on top of my wife's grave."}
],
419: [
    {es: "No perdamos contacto con la realidad.", en: "Let's not lose touch with reality."},
    {es: "No construyamos castillos en el aire.", en: "Let's not build castles in the air."},
    {es: "Te pareces a tu padre, (físicamente)", en: "You look like your father."},
    {es: "Te pareces a tu padre, (comportamiento)", en: "You take after your father."},
    {es: "Ya aprenderás los secretos del oficio.", en: "You'll learn the tricks of the trade."},
    {es: "Ya debería haber sido enviado.", en: "It should've already been sent."},
    {es: "¿Quién tuvo la genial idea de hacer eso?", en: "Who had the great idea to do that?"},
    {es: "No fui yo.", en: "It wasn't me."},
    {es: "La culpa fue de Pepe.", en: "It was Pepe's fault."},
    {es: "No me eches la culpa a mí.", en: "Don't blame me."},
    {es: "Siempre estás buscando a alguien a quien echar la culpa.", en: "You're always looking for someone to blame."},
    {es: "¿En qué dirección se fueron?", en: "Which way did they go?"},
    {es: "Hola, Juan, ¿qué tal estás?", en: "Hello, John, how are you doing?"},
    {es: "¿Qué tal van las cosas allí?", en: "How are things going there?"},
    {es: "Not an well as I had expected.", en: "Not as well as I had expected."},
    {es: "¿Te están dando mucha guerra?", en: "Are they giving you a hard time?"},
    {es: "Al contrario, soy tratado como un rey.", en: "On the contrary, I'm treated like a king."},
    {es: "Entonces, ¿qué es lo que pasa?", en: "Then what's the matter?"},
    {es: "Es el clima... no me acostumbro.", en: "It's the climate. I can't get used to it."},
    {es: "Te advertí que haría mucho frío.", en: "I warned you that it would be very cold."},
    {es: "No sé cómo puede la gente vivir aquí.", en: "I don't know how people can live here."},
    {es: "Anda, no es para tanto.", en: "Come on, it's not THAT bad."},
    {es: "Menos mal que sólo me queda una semana.", en: "It's a good thing I have only a week left."},
    {es: "Si no, me volvería loco.", en: "Otherwise I'd go crazy."},
    {es: "¿Qué opinan del nuevo proyecto?", en: "What do they think of the new project?"},
    {es: "Les gusta el diseño pero dicen que es demasiado caro.", en: "They like the design but they say it's too expensive."},
    {es: "Pero ese precio fue pactado hace meses.", en: "But the price was agreed on months ago."},
    {es: "Pero ese precio se basó en un diseño más avanzado.", en: "But that price was based on a more advanced design."},
    {es: "¿Cómo que más avanzado?", en: "What do you mean more advanced?"},
    {es: "No hemos cambiado ni una sola coma.", en: "We haven't changed a single comma."},
    {es: "Ellos parecen pensar que sí.", en: "They seem to think so."},
    {es: "¿Está Hans?", en: "Is Hans there?"},
    {es: "Que se ponga al teléfono.", en: "Have him get on the line."},
    {es: "Hola Hans, soy David.", en: "Hello Hans, this is David."},
    {es: "Juan me dice que no estáis de acuerdo con el precio.", en: "John tells me you don't agree on the price."},
    {es: "Así es... habéis hecho algunos cambios.", en: "That's right. You've made some changes."},
    {es: "El diseño es idéntico al que acordamos.", en: "The design is identical to the one we agreed on."},
    {es: "El diseño es igual, estoy de acuerdo.", en: "The design is the same, I agree."},
    {es: "Pero ¿por qué cambiasteis de materiales?", en: "But why did you change materials?"},
    {es: "Los materiales son según lo especificado.", en: "The materials are as specified."},
    {es: "Pero el proveedor es diferente.", en: "But the supplier is different."},
    {es: "¿Qué más da?", en: "What difference does it make?"},
    {es: "Este proveedor no está certificado.", en: "This supplier isn't certified."},
    {es: "¿Qué quieres decir \"not certified\"?", en: "What do you mean \"not certified\"?"},
    {es: "Sólo trabajamos con empresas certificadas por el BS1.", en: "We only work with companies certified by the BSI."},
    {es: "No sólo tenéis que estar certificados vosotros...", en: "Not only do you have to be certified..."},
    {es: "Sino todos vuestros proveedores también.", en: "But all your suppliers as well."},
    {es: "O sea, tenemos que renegociar.", en: "In other words, we have to renegotiate."},
    {es: "No veo otra salida.", en: "I don't see any other way out."},
    {es: "Tendré que someter esto al Consejo.", en: "I'll have to submit this to the Board."}
],
420: [
    {es: "Hay una escasez de mano de obra cualificada en este país.", en: "There's a shortage of skilled labour in this country."},
    {es: "No hay ni un solo ingeniero de caminos.", en: "There's not a single civil engineer."},
    {es: "Deberíais haber previsto ese problema.", en: "You should've foreseen that problem."},
    {es: "Mándame un fontanero y un electricista.", en: "Send me a plumber and an electrician."},
    {es: "Tengo dos físicos nucleares aquí que no están haciendo nada.", en: "I have two nuclear physicists here who are doing nothing."},
    {es: "Los voy a mandar a casa.", en: "I'm going to send them home."},
    {es: "Pero hasta mayo vamos a cargarles en tu cuenta.", en: "But until May we're going to charge them to your account."},
    {es: "Entonces no me eches la bronca si salgo del presupuesto.", en: "Then don't get on my back if I go over budget."},
    {es: "Fue idea tuya llevarlos allí en primer lugar.", en: "It was your idea to take them there in the first place."},
    {es: "No nos pidas que paguemos tu falta de previsión.", en: "Don't ask us to pay for your lack of foresight."},
    {es: "No soy perfecto... lo admito.", en: "I'm not perfect... I admit it."},
    {es: "¿Necesitas a alguien más?", en: "Do you need anyone else?"},
    {es: "Mándame un químico y un experto en hormigón.", en: "Send me a chemist and an expert in concrete."},
    {es: "Estamos en un callejón sin salida.", en: "We're on a dead-end street."},
    {es: "Se me han agotado las ideas.", en: "I've run out of ideas."},
    {es: "Atrepellaron al cartero.", en: "They ran over the postman."},
    {es: "El pobre hombre sufrió lesiones graves.", en: "The poor man suffered serious injuries."},
    {es: "Tuvo varias costillas rotas.", en: "He had several broken ribs."},
    {es: "La ambulancia tardó una hora en llegar.", en: "It took the ambulance an hour to arrive."},
    {es: "Una multitud de gente se congregó.", en: "A crowd of people gathered."},
    {es: "El conductor estaba muerto de miedo.", en: "The driver was scared to death."},
    {es: "Menos mal que estaba asegurado.", en: "It's a good thing he was insured."},
    {es: "Abran el libro por la página 40.", en: "Open the book to page 40."},
    {es: "Fíjense cómo empieza el quinto párrafo.", en: "Look at how the fifth paragraph begins."},
    {es: "Es típico de la nueva ola de escritores.", en: "It's typical of the new wave of writers."},
    {es: "Han tirado las reglas clásicas por la ventana.", en: "They've thrown the classical rules out the window."},
    {es: "¿Qué piensan Uds.? ¿Algunas opiniones?", en: "What do you think? Any opinions?"},
    {es: "Cualquiera puede hacer cosas así.", en: "Anybody can do things like that."},
    {es: "Me recuerda la pintura abstracta.", en: "It reminds me of abstract art."},
    {es: "¿En qué sentido?", en: "In what way?"},
    {es: "Nadie puede sacarle ni pies ni cabeza.", en: "Nobody can make heads or tails of it."},
    {es: "¡Vaya cara que tienes hoy!", en: "You look awful today!"},
    {es: "No he pegado ojo en toda la noche.", en: "I didn't get any sleep last night."},
    {es: "Incorpórate y manten la espalda recta.", en: "Sit up and keep your back straight."},
    {es: "Tienes que causar una buena impresión.", en: "You have to make a good impression."},
    {es: "Pareces viejo y agotado.", en: "You look tired and worn out."},
    {es: "Te están empezando a salir canas.", en: "You're starting to get gray hair."},
    {es: "Antes estabas lleno de energía.", en: "You used to be full of energy."},
    {es: "Antes eras más fuerte que un buey.", en: "You used to be stronger than an ox."},
    {es: "No eres el mismo desde tu divorcio.", en: "You're not the same since your divorce."},
    {es: "¿Qué quieres que haga?", en: "What do you want me to do?"},
    {es: "Sal y disfruta de la vida un poco.", en: "Go out and enjoy life a little."},
    {es: "Todavía no estoy para ello.", en: "I'm not up to it yet."},
    {es: "Pero tienes una larga vida por delante.", en: "But you have a long life ahead of you."},
    {es: "Mi vida ya no es lo que fue.", en: "My life isn't what it used to be."},
    {es: "Vivir solo me deprime.", en: "Living alone gets me down."},
    {es: "Me recuerdas a mi primo.", en: "You remind me of my cousin."},
    {es: "Tuvo el mismo problema pero lo resolvió.", en: "He had the same problem but he solved it."},
    {es: "Se apuntó a un viaje colectivo al Japón.", en: "He signed up for a package tour to japan."},
    {es: "Conoció a una chica y se casó con ella.", en: "He met a girl and married her."}
],
421: [
    {es: "¿Qué tiene que ver mi coche con tu casa?", en: "What does my car have to do with your house?"},
    {es: "Hoy en día la ropa no tiene que hacer juego.", en: "Nowadays clothes don't have to match."},
    {es: "Me apuesto a que no sabes mi nombre.", en: "I bet you don't know my name."},
    {es: "Se está haciendo cada vez más difícil.", en: "It's getting harder and harder."},
    {es: "Tropecé con Juan en el metro.", en: "I ran into John in the subway."},
    {es: "Chocaron contra el muro.", en: "They ran into the wall."},
    {es: "Fui corriendo detrás de ella.", en: "I ran after her."},
    {es: "La alcancé en la esquina.", en: "I caught up with her at the corner."},
    {es: "Tendremos éxito a la larga.", en: "We'll succeed in the long run."},
    {es: "Nos quedamos sin gasolina.", en: "We ran out of gasoline."},
    {es: "El Sr. Pérez tiene la palabra.", en: "Mr. Perez has the floor."},
    {es: "Si tuviéramos que empezar de cero...", en: "If we had to start from scratch..."},
    {es: "Pensándolo bien, sí quiero una cerveza.", en: "On second thought, I do want a beer."},
    {es: "Me aseguraré que se haga.", en: "I'll see to it that it's done."},
    {es: "Lo tienes bien merecido.", en: "It serves you right."},
    {es: "Sólo veo un inconveniente.", en: "I only see one drawback."},
    {es: "En resumidas cuentas, estoy de acuerdo.", en: "In short, I agree."},
    {es: "Cortaron la reunión antes de lo previsto.", en: "They cut the meeting short."},
    {es: "¿Quién dirige este cotarro?", en: "Who's running this show?"},
    {es: "Le gusta presumir de su coche nuevo.", en: "He likes to show off his new car."},
    {es: "Si no lo hubieras lavado en agua caliente, no se habría encogido.", en: "If you hadn't washed it in hot water, it wouldn't have shrunk."},
    {es: "Se encoge incluso en agua fría.", en: "It shrinks even in cold water."},
    {es: "Métete por la primera calle lateral.", en: "Turn down the first side street."},
    {es: "No hay un stop pero tienes de ceder.", en: "There isn't a stop sign but you have to yield."},
    {es: "Tengo los cables cruzados.", en: "I've got my wires crossed."},
    {es: "No se te ocurra llamarle ahora.", en: "You'd better not call him now."},
    {es: "¿Cómo pretendes que le localice?", en: "How do you expect me to locate him?"},
    {es: "Tienes que usar métodos más sutiles.", en: "You have to use more subtle ways."},
    {es: "Me dieron una lista de reivindicaciones.", en: "They gave me a list of grievances."},
    {es: "Exigen más dinero y menos trabajo.", en: "They demand more money and less work."},
    {es: "Cualquier subida de salarios será supeditada a un aumento en la productividad.", en: "Any wage increase will be tied to an increase in productivity."},
    {es: "Ojalá todo estuviera automatizado.", en: "I wish everything were automated."},
    {es: "Las máquinas no se declaran en huelga.", en: "Machines don't go on strike."},
    {es: "No se enferman cada dos por tres.", en: "They don't get sick every other day."},
    {es: "Hacen lo que les dicen sin rechistar.", en: "They do what you tell them without saying a word."},
    {es: "Sería un sueño hecho realidad.", en: "It would be a dream come true."},
    {es: "Desenchúfalo antes de repararlo.", en: "Unplug it before repairing it."},
    {es: "Dan por sentado que estamos de acuerdo.", en: "They take for granted that we agree."},
    {es: "Déjame que te dé un consejo.", en: "Let me give you a piece of advice."},
    {es: "Yo que tú no lo haría.", en: "If I were you, I wouldn't do it."},
    {es: "¡Vaya golpe de suerte!", en: "What a stroke of luck!"},
    {es: "Quiero desearte mucha suerte.", en: "I want to wish you the best of luck."},
    {es: "Probaré fortuna en esta profesión.", en: "I'll try my luck in this profession."},
    {es: "Con un poco de suerte, puede que ganes.", en: "With a little bit of luck, you may win."},
    {es: "Me complace anunciar que...", en: "It pleases me to announce that..."},
    {es: "Sírvase Ud. mismo.", en: "Help yourself."},
    {es: "Él es muy difícil de contentar.", en: "He's very hard to please."},
    {es: "Estoy satisfecho con tu progreso.", en: "I'm pleased with your progress."},
    {es: "¿Hay algún motivo para continuar?", en: "Is there any point in going on?"},
    {es: "Él quiere sumar puntos con el jefe.", en: "He wants to score points with the boss."}
],
422: [
    {es: "Por mucho que lo intentes, no lo conseguirás.", en: "No matter how hard you try, you won't achieve it."},
    {es: "Vayas donde vayas, te encontraré.", en: "Wherever you go, I'll find you."},
    {es: "Haz lo que quieras.", en: "Do whatever you want."},
    {es: "Diga lo que diga, no me cree.", en: "Whatever I say, he doesn't believe me."},
    {es: "El proyecto está en marcha.", en: "The project is underway."},
    {es: "Van a buen ritmo.", en: "They are making good progress."},
    {es: "No debemos confiarnos.", en: "We mustn't get overconfident."},
    {es: "Surgen imprevistos todos los días.", en: "Unexpected things come up every day."},
    {es: "Hay que estar preparados para todo.", en: "We have to be prepared for everything."},
    {es: "La prevención es la mejor herramienta.", en: "Prevention is the best tool."},
    {es: "Nadie esperaba este resultado.", en: "Nobody expected this result."},
    {es: "Han superado nuestras expectativas.", en: "They have exceeded our expectations."},
    {es: "Es una gran noticia para la empresa.", en: "It's great news for the company."},
    {es: "Hay que celebrarlo por todo lo alto.", en: "We have to celebrate it in style."},
    {es: "Reserva una mesa en el restaurante de siempre.", en: "Book a table at our usual restaurant."},
    {es: "Que avisen a todo el equipo.", en: "Let them notify the whole team."},
    {es: "Nadie puede faltar a la cita.", en: "Nobody can miss the appointment."},
    {es: "El éxito es fruto del esfuerzo común.", en: "Success is the result of a joint effort."},
    {es: "Todos habéis puesto de vuestra parte.", en: "You've all played your part."},
    {es: "Os estoy muy agradecido.", en: "I am very grateful to you."},
    {es: "El camino no ha sido fácil.", en: "The road hasn't been easy."},
    {es: "Hemos tenido que superar muchos obstáculos.", en: "We've had to overcome many obstacles."},
    {es: "Pero al final ha merecido la pena.", en: "But in the end it has been worth it."},
    {es: "Mañana será otro día de trabajo.", en: "Tomorrow will be another working day."},
    {es: "Hay que mantener los pies en la tierra.", en: "We must keep our feet on the ground."},
    {es: "Nuevos retos nos esperan.", en: "New challenges await us."},
    {es: "Estemos preparados para afrontarlos.", en: "Let's be prepared to face them."},
    {es: "La competencia no descansa.", en: "The competition never rests."},
    {es: "Debemos ir un paso por delante.", en: "We must stay one step ahead."},
    {es: "La innovación es nuestra clave.", en: "Innovation is our key."},
    {es: "Sin ideas nuevas no hay futuro.", en: "Without new ideas there is no future."},
    {es: "Escuchemos las propuestas de todos.", en: "Let's listen to everyone's proposals."},
    {es: "Todas las opiniones cuentan.", en: "All opinions count."},
    {es: "No descartemos ninguna opción.", en: "Let's not rule out any option."},
    {es: "A veces las mejores ideas surgen de donde menos lo esperas.", en: "Sometimes the best ideas come from where you least expect them."},
    {es: "Mantengamos la mente abierta.", en: "Let's keep an open mind."},
    {es: "El trabajo en equipo marca la diferencia.", en: "Teamwork makes the difference."},
    {es: "La comunicación es fundamental.", en: "Communication is essential."},
    {es: "Evitemos malentendidos innecesarios.", en: "Let's avoid unnecessary misunderstandings."},
    {es: "Hablemos con claridad.", en: "Let's speak clearly."},
    {es: "Las puertas de mi despacho siempre están abiertas.", en: "The doors to my office are always open."},
    {es: "Acudid a mí si tenéis cualquier duda.", en: "Come to me if you have any doubts."},
    {es: "Juntos llegaremos muy lejos.", en: "Together we will go very far."},
    {es: "Confío plenamente en vosotros.", en: "I trust you completely."},
    {es: "No os defraudaré.", en: "I won't let you down."},
    {es: "A por todas.", en: "Let's go for it."},
    {es: "Ánimo con la jornada.", en: "Good luck with the workday."},
    {es: "Que tengáis un excelente día.", en: "Have an excellent day."},
    {es: "Nos vemos en la reunión de la tarde.", en: "See you at the afternoon meeting."},
    {es: "Fin del comunicado.", en: "End of message."}
],
423: [
    {es: "Hagas lo que hagas, ten cuidado.", en: "No matter what you do, be careful."},
    {es: "Crea un fichero para los datos.", en: "Create a file for the data."},
    {es: "Tardarás un día en introducir los datos.", en: "It'll take a day to enter the data."},
    {es: "La reunión se ha convocado para mañana.", en: "The meeting has been called for tomorrow."},
    {es: "Estoy preparando el orden del día.", en: "I'm preparing the agenda."},
    {es: "El Consejo se reúne cada dos meses.", en: "The Board meets every two months."},
    {es: "¿Cuánto tiempo suele durar la reunión?", en: "How long does the meeting usually last?"},
    {es: "Casi nunca sobrepasa las dos horas.", en: "It hardly ever goes beyond two hours."},
    {es: "Eso es corto para una reunión de consejo.", en: "That's short for a board meeting."},
    {es: "Así lo quiere el presidente.", en: "That's how the chairman wants it."},
    {es: "Me hubiera gustado ver su cara.", en: "I would've liked to have seen his face."},
    {es: "Realmente no estaba tan enfadado.", en: "He really wasn't that angry."},
    {es: "Encajó las noticias bastante bien.", en: "He took the news pretty well."},
    {es: "Creí que iba a explotar.", en: "I thought he was going to blow up."},
    {es: "La empresa suspendió pagos.", en: "The company suspended payments."},
    {es: "Apunta la cantidad en esta casilla.", en: "Write down the amount in this box."},
    {es: "Rellena estos dos espacios en blanco.", en: "Fill in these two blanks."},
    {es: "Fírmalo en la esquina inferior derecha.", en: "Sign it at the bottom right corner."},
    {es: "Suma las cantidades.", en: "Add up the amounts."},
    {es: "Si hubiera habido un excedente de trigo, lo habríamos exportado.", en: "If there had been a surplus of wheat, we would've exported it."},
    {es: "Una economía produce bienes y servicios.", en: "An economy produces goods and services."},
    {es: "Los precios oscilan según la oferta y la demanda.", en: "Prices fluctuate according to supply and demand."},
    {es: "Cuando la oferta excede la demanda, los precios bajan.", en: "When supply exceeds demand, prices fall."},
    {es: "En el caso contrario, suben.", en: "In the opposite case they go up."},
    {es: "Muchos factores influyen en el PIB.", en: "Many factors influence GNP."},
    {es: "¿Qué significa PIB?", en: "What does GNP mean?"},
    {es: "Significa producto interior bruto.", en: "It means gross national product."},
    {es: "Mide el tamaño y la salud de la economía.", en: "It measures the size and health of the economy."},
    {es: "Buenos días, Sr. Pérez. Soy Pedro.", en: "Good morning, Mr. Perez. This is Peter."},
    {es: "Le llamo de General Motors.", en: "I'm calling you from General Motors."},
    {es: "Soy el nuevo director de compras.", en: "I'm the new purchasing manager."},
    {es: "Le llamo acerca de un pequeño problema con su factura.", en: "I'm calling you about a small problem with your invoice."},
    {es: "Me refiero a la factura número 3030.", en: "I'm referring to invoice number 3030."},
    {es: "La factura para piezas y mano de obra.", en: "The invoice for parts and labour."},
    {es: "Al parecer hubo un malentendido.", en: "Apparently there was a misunderstanding."},
    {es: "Teníamos entendido que no nos iba a cobrar por la mano de obra.", en: "We understood that you weren't going to charge us for labour."},
    {es: "Eso puede ser, pero no en nuestro caso.", en: "That may be, but not in our case."},
    {es: "Su carta del 3 de mayo afirmó que la mano de obra sería libre de cargo.", en: "Your letter of May 3rd stated that labour would be free of charge."},
    {es: "¿Quisiera que le mandara una copia?", en: "Would you like me to send you a copy?"},
    {es: "Comprendo perfectamente su política.", en: "I perfectly understand your policy."},
    {es: "El acuerdo está claro en este punto.", en: "The agreement is clear on this point."},
    {es: "Lleva dos meses en vigor.", en: "It's been in force for two months."},
    {es: "No podemos cursar esta factura.", en: "We can't process this invoice."},
    {es: "Lo siento, pero no podemos hacer nada.", en: "I'm sorry but we can't do anything."},
    {es: "Le tengo que devolver la factura.", en: "I have to return the invoice to you."},
    {es: "Expida una nueva sin la mano de obra.", en: "Issue a new one without labour."},
    {es: "Le pagaremos cuando la recibamos.", en: "We'll pay you when we receive it."},
    {es: "Cursaremos la factura sin demora.", en: "We'll process the invoice without delay."},
    {es: "Es un placer hacer negocios con Ud.", en: "It's a pleasure doing business with you."},
    {es: "Sigamos en contacto.", en: "Let's stay in touch."}
],
424: [
    {es: "No he hecho nada en absoluto.", en: "I haven't done anything at all."},
    {es: "Alguien debería investigar ese asunto.", en: "Someone should look into that matter."},
    {es: "A nadie parece importarle demasiado.", en: "Nobody seems to care that much."},
    {es: "No lo dobles así.", en: "Don't fold it like that."},
    {es: "Aléjate del fuego.", en: "Get away from the fire."},
    {es: "Ella se dio de baja de la clase.", en: "She dropped out of the class."},
    {es: "Tienes que dar paso a esos coches.", en: "You have to give way to those cars."},
    {es: "Este tipo de calendario resulta útil.", en: "This kind of calendar comes in handy."},
    {es: "Llámale de nuevo.", en: "Call him back."},
    {es: "Averigua todo lo que puedas.", en: "Find out everything you can."},
    {es: "Estoy esperándolo con mucha ilusión.", en: "I'm looking forward to it."},
    {es: "Échale un vistazo y dime lo que opinas.", en: "Look it over and tell me what you think."},
    {es: "Espera... déjame coger un lápiz.", en: "Hang on... let me get a pencil."},
    {es: "Os parecéis mucho.", en: "You look a lot alike."},
    {es: "Dimos por supuesto que lo sabías.", en: "We took for granted that you knew it."},
    {es: "No deberías burlarte de esa gente.", en: "You shouldn't make fun of those people."},
    {es: "Hay espacio para uno más.", en: "There's room for one more."},
    {es: "Cálmate.", en: "Calm down."},
    {es: "Puedes descartar esa posibilidad.", en: "You can rule out that possibility."},
    {es: "Las cortinas prendieron fuego.", en: "The curtains caught fire."},
    {es: "Nosotros rellenaremos esos recuadros.", en: "We'll fill in those boxes."},
    {es: "¿Podrías dar marcha atrás unos metros?", en: "Could you back up a few meters?"},
    {es: "Manten la espalda recta.", en: "Keep your back straight."},
    {es: "Si tengo una moneda se la daré.", en: "If I have a coin, I'll give it to him."},
    {es: "Si tuviera una moneda, te la daría.", en: "If I had a coin, I'd give it to you."},
    {es: "Si hubiera tenido una moneda, se la habría dado.", en: "If I had had a coin, I would've given it to him."},
    {es: "Si puedo, lo haré.", en: "If I can, I'll do it."},
    {es: "Si pudiera, lo haría.", en: "If I could, I'd do it."},
    {es: "Si hubiera podido, lo habría hecho.", en: "If I had been able, I would've done it."},
    {es: "Si sé la respuesta, te la diré.", en: "If I know the answer, I'll tell you."},
    {es: "Si supiera la respuesta, te la diría.", en: "If I knew the answer, I'd tell you."},
    {es: "Si hubiera sabido la respuesta, te la habría dicho.", en: "If I had known the answer, I would've told you."},
    {es: "Si hay tiempo, se hará.", en: "If there's time, it will be done."},
    {es: "Si hubiera tiempo, se haría.", en: "If there were time, it would be done."},
    {es: "Si hubiera habido tiempo, se habría hecho.", en: "If there had been time, it would have been done."},
    {es: "¿Ha habido incidentes últimamente?", en: "Have there been any incidents lately?"},
    {es: "Me cuesta trabajo entenderte.", en: "I have trouble understanding you."},
    {es: "Cuanto más rápido vas, más pronto llegas.", en: "The faster you go, the sooner you arrive."},
    {es: "No quiero entrar en detalles.", en: "I don't want to go into detail."},
    {es: "Más vale que me digas todo.", en: "You'd better tell me everything."},
    {es: "Apunta antes de disparar.", en: "Aim before firing."},
    {es: "Tu progreso no ha sido del todo bueno.", en: "Your progress hasn't been all that good."},
    {es: "No puedes mantenerte con el grupo.", en: "You can't keep up with the group."},
    {es: "Te estás quedando atrás.", en: "You're falling behind."},
    {es: "Pronto serás un lastre para el grupo.", en: "Soon you'll be a drag on the group."},
    {es: "Te voy a sacar del grupo.", en: "I'm going to take you out of the group."},
    {es: "Lo estoy haciendo por tu propio bien.", en: "I'm doing it for your own good."},
    {es: "Si hubieras hecho un mayor esfuerzo, no habríamos llegado a esto.", en: "If you had made a greater effort, we wouldn't have come to this."},
    {es: "Pero puesto que no hiciste un esfuerzo, no tenemos más remedio.", en: "But since you didn't make an effort, we have no choice."},
    {es: "Deberías haber estudiado más.", en: "You should've studied more."}
],
425: [
    {es: "No queda nada por hacer.", en: "There's nothing left to do."},
    {es: "Me voy.", en: "I'm leaving."},
    {es: "Ya no aguanto esto.", en: "I can't stand this anymore."},
    {es: "Eres libre de hacer lo que quieras.", en: "You're free to do whatever you want."},
    {es: "Puedes hacer lo que te dé la gana.", en: "You can do whatever you feel like."},
    {es: "Nadie te está reteniendo aquí.", en: "Nobody's keeping you here."},
    {es: "¿A quién le gusta este sitio?", en: "Who likes this place?"},
    {es: "¿Qué le gusta a Juan?", en: "What does John like?"},
    {es: "¿Cuáles son tus prioridades?", en: "What are your priorities?"},
    {es: "Para ser eficaz, debes fijar prioridades.", en: "To be effective, you must set priorities."},
    {es: "¿Te importaría regarme las plantas?", en: "Would you mind watering my plants?"},
    {es: "Voy a estar fuera durante tres semanas.", en: "I'm going to be away for three weeks."},
    {es: "Pasaré por tu oficina para dejarte la llave.", en: "I'll drop by your office to leave you the key."},
    {es: "¿Estarás allí sobre las seis?", en: "Will you be there around six?"},
    {es: "¿Cuándo estarás de vuelta?", en: "When will you be back?"},
    {es: "Que te o pases muy bien.", en: "Have a good time."},
    {es: "No hagas nada que yo no haría.", en: "Don't do anything I wouldn't do."},
    {es: "Mándame una postal.", en: "Send me a postcard."},
    {es: "Esto podría haber sido peor.", en: "This could've been worse."},
    {es: "Menos mal que nos enteramos de ello a tiempo.", en: "It's a good thing we learned about it in time."},
    {es: "Pudiéramos haber sufrido pérdidas.", en: "We could have suffered losses."},
    {es: "No quiero que esto vuelva a ocurrir.", en: "I don't want this to happen again."},
    {es: "Hemos estado estudiando tu propuesta.", en: "We've been studying your proposal."},
    {es: "¿Cómo piensas medir el éxito de la campaña?", en: "How do you plan to measure the success of the campaign?"},
    {es: "¿Quién va a llevar a cabo la encuesta?", en: "Who's going to carry out the survey?"},
    {es: "¿Cuánto tardarán?", en: "How long will it take them?"},
    {es: "¿Cuánto nos cobrarán?", en: "How much will they charge us?"},
    {es: "¿Cuándo lanzaremos la campaña de prensa?", en: "When will we launch the press campaign?"},
    {es: "¿Vamos a hacer una campaña de mailing?", en: "Are we going to do a mailing campaign?"},
    {es: "¿Cuántas cartas se van a mandar?", en: "How many letters are going to be sent?"},
    {es: "¿Estamos dentro del presupuesto?", en: "Are we in budget?"},
    {es: "¿Qué mas vamos a hacer?", en: "What else are we going to do?"},
    {es: "¿No sería mejor subcontratarlo?", en: "Wouldn't it be better to subcontract it?"},
    {es: "Son con mucho los más capaces.", en: "They're by far the most capable."},
    {es: "Quiero un estudio en profundidad.", en: "I want an in-depth study."},
    {es: "En cuanto a él, puedes hacer lo que quieras.", en: "As for him, you can do whatever you want."},
    {es: "Se comporta como si fuera el jefe.", en: "He behaves as if he were the boss."},
    {es: "Están al tanto de todo.", en: "They're aware of everything."},
    {es: "No hay duda al respecto.", en: "There's no doubt about it."},
    {es: "Salí con las manos vacías.", en: "I came out empty-handed."},
    {es: "Tienes que dar ejemplo.", en: "You have to set an example."},
    {es: "Hasta cierto punto estoy de acuerdo.", en: "To a certain extent I agree."},
    {es: "Que yo sepa, nada ha cambiado.", en: "As far as I know, nothing has changed."},
    {es: "En lo a mí se refiere, te puedes ir.", en: "As far as I'm concerned, you can leave."},
    {es: "Hasta ahora todo ha ido bien.", en: "So far everything has gone well."},
    {es: "Nací a principios de los cincuenta.", en: "I was born in the early fifties."},
    {es: "Me casé a finales de los setenta.", en: "I got married in the late seventies."},
    {es: "Nos mudamos a mediados de los sesenta.", en: "We moved in the mid sixties."},
    {es: "Soy partidario de ir en coche.", en: "I'm in favour of going by car."},
    {es: "Han ocurrido bastantes cosas desde entonces.", en: "Quite a few things have happened since then."}
],
426: [
    {es: "Cruzaron la meta en primer lugar.", en: "They crossed the finish line in first place."},
    {es: "Estamos ganándoles terreno.", en: "We're gaining ground on them."},
    {es: "Les estamos alcanzando.", en: "We're catching up with them."},
    {es: "Se ajusta como un guante.", en: "It fits like a glove."},
    {es: "Tengo que tratarles con guante de seda.", en: "I have to treat them with a velvet glove."},
    {es: "Por el amor de Dios, ¿qué has hecho?", en: "For God's sakes, what have you done?"},
    {es: "Me voy para siempre.", en: "I'm leaving for good."},
    {es: "No te guardo rencor.", en: "I don't hold a grudge against you."},
    {es: "Nos asaltaron a punta de pistola.", en: "They held us up at gunpoint."},
    {es: "No quiero rizar el rizo.", en: "I don't want to split hairs."},
    {es: "Nos dejaron salir con ventaja.", en: "They gave us a head start."},
    {es: "Hazlo de esta forma por si acaso.", en: "Do it this way just in case."},
    {es: "Hablaron detenidamente sobre el asunto.", en: "They spoke at length about the matter."},
    {es: "A la larga todo saldrá bien.", en: "In the long run, everything will turn out fine."},
    {es: "Lo último que necesitamos aquí es un bocazas como él.", en: "The last thing we need here is a loudmouth like him."},
    {es: "El se enamoró locamente de ella.", en: "He fell madly in love with her."},
    {es: "Tienes suerte de tener un marido como él.", en: "You're lucky to have a husband like him."},
    {es: "Este negocio existe para ganar dinero.", en: "This business exists to make money."},
    {es: "No importa cómo.", en: "It doesn't matter how."},
    {es: "Tenemos tres productos en el mercado.", en: "We have three products on the market."},
    {es: "Mientras tanto, puedes revisar esto.", en: "In the meantime you can check this."},
    {es: "¡Qué follón!", en: "What a mess!"},
    {es: "Siempre estoy de buen humor.", en: "I'm always in a good mood."},
    {es: "Duermo la siesta todas las tardes.", en: "I take a nap every afternoon."},
    {es: "Nunca mantienes tus promesas.", en: "You never keep your promises."},
    {es: "Quiero convocar una reunión especial.", en: "I want to call a special meeting."},
    {es: "Quiero que hagas una presentación.", en: "I want you to make a presentation."},
    {es: "Quiero que prepares algo sobre la calidad total.", en: "I want you to prepare something about total quality."},
    {es: "¿Prefieres usar transparencias o diapositivas?", en: "Do you prefer to use overheads or slides?"},
    {es: "Los jefes de departamento asistirán.", en: "The department heads will attend."},
    {es: "¿Cuánto tardarás en prepararlo?", en: "How long will it take you to prepare it?"},
    {es: "¿Qué ha sido ese ruido?", en: "What was that noise?"},
    {es: "Yo no he oído nada.", en: "I didn't hear anything."},
    {es: "Viene de la cocina.", en: "It's coming from the kitchen."},
    {es: "Suena como si algo estuviera hirviendo.", en: "It sounds as if something were boiling."},
    {es: "Te dije que no bajaras el volumen.", en: "I told you not to turn down the volume."},
    {es: "Súbelo un poco.", en: "Turn it up a little."},
    {es: "Hay un montón de papeles sobre mi mesa.", en: "There's a stack of paper on my desk."},
    {es: "Han subido los costes laborales.", en: "Labour costs have gone up."},
    {es: "Descansemos unos minutos en la sombra.", en: "Let's rest for a few minutes in the shade."},
    {es: "Nos quedan aún 3 kilómetros.", en: "We still have 3 kilometres left."},
    {es: "Voy a hacer el resto del camino andando.", en: "I'm going to walk the rest of the way."},
    {es: "Apenas puedo mantenerme de pie.", en: "I can hardly stay on my feet."},
    {es: "¿Me ayudas a levantarme?", en: "Can you help me get up?"},
    {es: "Se nos está acabando el tiempo.", en: "Our time is running out."},
    {es: "No te preocupes... nos sobra tiempo.", en: "Don't worry... we have plenty of time."},
    {es: "Mi hijo por fin se ha graduado.", en: "My son has finally graduated."},
    {es: "Ha tardado 10 años.", en: "It's taken him 10 years."},
    {es: "Ha sido una lucha constante año tras año.", en: "It's been a constant struggle year after year."},
    {es: "Pero ha valido la pena.", en: "But it's been worth it."}
],
427: [
    {es: "Prepárate para una sorpresa.", en: "Prepare yourself for a surprise."},
    {es: "La compañía te va a ascender.", en: "The company is going to promote you."},
    {es: "A partir de mañana, vas a ser una persona importante.", en: "Starting tomorrow, you're going to be an important person."},
    {es: "Comerás en el comedor ejecutivo.", en: "You'll eat in the executive dining room."},
    {es: "Viajarás en primera clase.", en: "You'll travel in first class."},
    {es: "Tendrás un coche de la compañía.", en: "You'll have a company car."},
    {es: "Te darán una cuenta de gastos.", en: "They'll give you an expense account."},
    {es: "Tu foto aparecerá en la prensa.", en: "Your picture will appear in the press."},
    {es: "Dos departamentos dependerán de ti.", en: "Two departments will report to you."},
    {es: "Serás la mano derecha del presidente.", en: "You'll be the chairman's right-hand man."},
    {es: "Tu despacho estará en la planta superior.", en: "Your office will be on the top floor."},
    {es: "Tendrás un cuarto de baño privado.", en: "You'll have a private bathroom."},
    {es: "Tu despacho será 3 veces mayor que éste.", en: "Your office will be 3 times bigger than this one."},
    {es: "Tendrás una moqueta de lana.", en: "You'll have a wool carpet."},
    {es: "Tu ventana dará al río.", en: "Your window will look over the river."},
    {es: "Verás el aeropuerto a lo lejos.", en: "You'll see the airport in the distance."},
    {es: "Podrás ver el ir y venir de los aviones.", en: "You'll see the planes coming and going."},
    {es: "¿Y sabes qué mas?", en: "And do you know what else?"},
    {es: "Paquita será tu secretaria.", en: "Paquita will be your secretary."},
    {es: "No quiero que ella sea mi secretaria.", en: "I don't want her to be my secretary."},
    {es: "Ella es muy mandona y dominante.", en: "She's very bossy and domineering."},
    {es: "Ella me pone nervioso.", en: "She makes me nervous."},
    {es: "Y además, se queja todo el tiempo.", en: "And besides, she complains all the time."},
    {es: "Más vale que te acostumbres a ella.", en: "You'd better get used to her."},
    {es: "Fue por decisión del presidente.", en: "It was the chairman's decision."},
    {es: "Tómalo o déjalo.", en: "Take it or leave it."},
    {es: "Ayudarás a elaborar su agenda.", en: "You'll help to draw his agenda."},
    {es: "Asistirás a las reuniones del consejo.", en: "You'll attend the board meetings."},
    {es: "No me atrevería a hacer algo así.", en: "I wouldn't dare do something like that."},
    {es: "Déjame que intente una vez más.", en: "Let me try one more time."},
    {es: "No te decepcionaré.", en: "I won't let you down."},
    {es: "Puedes contar conmigo.", en: "You can count on me."},
    {es: "Vamos a salir del presupuesto.", en: "We're going to run over budget."},
    {es: "Firma encima de la línea discontinua.", en: "Sign above the dotted line."},
    {es: "El que sea verdad o no es otra cuestión.", en: "Whether it's true or not is another matter."},
    {es: "Estén de acuerdo con nosotros o no, vamos a seguir adelante.", en: "Whether they agree with us or not, we're going to go ahead."},
    {es: "Cuando sonríes pareces 10 años más joven.", en: "When you smile you look 10 years younger."},
    {es: "¿Por qué siempre te pones tan serio?", en: "Why do you always look so serious?"},
    {es: "¿Por qué abandonaste tu país?", en: "Why did you leave your country?"},
    {es: "Hubo una serie de huelgas que desestabilizaron la economía.", en: "There was a series of strikes that destabilised the economy."},
    {es: "Se convocaron elecciones anticipadas.", en: "Early elections were called."},
    {es: "Nadie ganó una mayoría.", en: "Nobody won a majority."},
    {es: "Hubo luchas internas en cada partido.", en: "There was political in-fighting in every party."},
    {es: "Los militares se hicieron con el poder.", en: "The military took power."},
    {es: "Decidieron abolir los partidos.", en: "They decided to abolish the parties."},
    {es: "Me metieron en la cárcel.", en: "They put me in jail."},
    {es: "A los 2 años hubo una amnistía general.", en: "Two years later, there was a general amnesty."},
    {es: "Compré un billete de avión y aquí estoy.", en: "I bought a plane ticket and here I am."},
    {es: "Ahora tengo que empezar de cero.", en: "Now I have to start from scratch."},
    {es: "Menos mal que no perdí mis ahorros.", en: "It's a good thing I didn't lose my savings."}
],
428: [
    {es: "Estamos al borde del precipicio.", en: "We're on the edge of the cliff."},
    {es: "Estoy al borde de un ataque de nervios.", en: "I'm on the verge of a nervous breakdown."},
    {es: "Ha llegado el momento de hacer algo.", en: "The time has come to do something."},
    {es: "Tengo un alto concepto de él.", en: "I have a high regard for him."},
    {es: "Siempre parece saber lo que hace.", en: "He always seems to know what he's doing."},
    {es: "Tiene un sexto sentido como las mujeres.", en: "He has a sixth sense like women."},
    {es: "Las mujeres no tienen seis sentidos.", en: "Women don't have six senses."},
    {es: "Tienen mucha más intuición que nosotros.", en: "They have much more intuition than we do."},
    {es: "¿Cómo vas a encuadernar esos papeles?", en: "How are you going to bind those papers?"},
    {es: "De la forma habitual.", en: "In the usual way."},
    {es: "¿Cómo se hace aquí?", en: "How is it done here?"},
    {es: "Se hace mediante un proceso térmico.", en: "It's done by means of a heat process."},
    {es: "¿Cómo has dado conmigo?", en: "How did you find me?"},
    {es: "Busqué tu nombre en la guía telefónica.", en: "I looked up your name in the phone book."},
    {es: "No te has afeitado hoy.", en: "You didn't shave today."},
    {es: "Tengo intención de dejarme barba.", en: "I'm planning to grow a beard."},
    {es: "Pero estás bien cómo estás.", en: "But you're fine the way you are."},
    {es: "Hemos adelantado la reunión.", en: "We've brought the meeting forward."},
    {es: "No creo que lo hicieran.", en: "I don't think they did it."},
    {es: "No podrían haberlo hecho.", en: "They couldn't have done it."},
    {es: "Estaban conmigo toda la noche.", en: "They were with me all night."},
    {es: "Es imposible que lo hicieran.", en: "It's impossible for them to have done it."},
    {es: "Me hubiera gustado estar contigo.", en: "I would've liked to have been with you."},
    {es: "Habría dado lo que fuera por estar allí.", en: "I would've given anything to have been there."},
    {es: "En aquel entonces, había una chica que me gustaba.", en: "At that time, there was a girl I liked."},
    {es: "Se sentaba delante de mí en la clase.", en: "She sat in front of me in class."},
    {es: "Era la chica más hermosa que jamás había visto.", en: "She was the most beautiful girl I had ever seen."},
    {es: "No podía quitar los ojos de ella.", en: "I couldn't take my eyes off her."},
    {es: "Menos mal que se sentaba delante de mí.", en: "It's a good thing she sat in front of me."},
    {es: "No se daba cuenta de que la miraba.", en: "She didn't realise I was looking at her."},
    {es: "Quería pedirle que saliera conmigo.", en: "I wanted to ask her to go out with me."},
    {es: "Tardé dos meses en reunir suficiente valor.", en: "It took me 2 months to get up enough courage."},
    {es: "La paré en el pasillo y se lo pregunté.", en: "I stopped her in the hall and asked her."},
    {es: "Parecía sorprendida pero aceptó.", en: "She seemed surprised but she accepted."},
    {es: "El viernes la recogí en su casa.", en: "On Friday, I picked her up at her house."},
    {es: "Había reservado una mesa en el mejor restaurante de la ciudad.", en: "I had reserved a table in the best restaurant in town."},
    {es: "Fue una cena maravillosa.", en: "It was a wonderful dinner."},
    {es: "Antes del postre fui al servicio.", en: "Before the dessert, I went to the men's room."},
    {es: "De vuelta a la mesa, la chica se reía.", en: "Back at the table, the girl was laughing."},
    {es: "Me dijo que mi cremallera estaba abierta.", en: "She told me my zipper was open."},
    {es: "La cerré muy discretamente.", en: "I closed it very discreetly."},
    {es: "No me di cuenta de algo importante.", en: "I didn't realise something important."},
    {es: "El mantel se había enganchado en mi cremallera.", en: "The tablecloth had got stuck in my zipper."},
    {es: "Imagínate lo que pasó después.", en: "Imagine what happened then."},
    {es: "Me levanté de la mesa para irme.", en: "I got up from the table to leave."},
    {es: "Di unos pasos entre las mesas.", en: "I took some steps between the tables."},
    {es: "Llevé el mantel conmigo sin darme cuenta.", en: "I took the tablecloth with me without realising it."},
    {es: "Todos los platos cayeron al suelo.", en: "All the plates fell to the floor."},
    {es: "Toda la gente me miraba.", en: "All the people were looking at me."},
    {es: "Me casé con la chica 5 años más tarde.", en: "I married the girl 5 years later."}
],
429: [
    {es: "Un hombre entró en un callejón.", en: "A man walked into an alley."},
    {es: "Era de noche.", en: "It was nighttime."},
    {es: "Se acercó (andando) a tres hombres.", en: "He walked up to three men."},
    {es: "Les enseñó algo que llevaba en una caja.", en: "He showed them something he was carrying in a box."},
    {es: "Los tres miraron en la caja.", en: "The three looked into the box."},
    {es: "¿Qué es lo que buscaban?", en: "What were they looking for?"},
    {es: "Buscaban un brazo.", en: "They were looking for an arm."},
    {es: "¿Por qué me cuentas historias como esa?", en: "Why do you tell me stories like that?"},
    {es: "Creía que te gustaban.", en: "I thought you liked them."},
    {es: "Me ponen los pelos de punta.", en: "They make my hair stand on end."},
    {es: "Hablemos de cosas más agradables.", en: "Let's talk about nicer things."},
    {es: "Pero primero termina el relato.", en: "But first finish the story."},
    {es: "Para resumirlo, se trataba de un médico.", en: "To sum it up, it was about a doctor."},
    {es: "El que llevaba la caja era médico.", en: "The one carrying the box was a doctor."},
    {es: "Dos días antes se había cortado el brazo.", en: "Two days before he had cut off his arm."},

    let libroActual = 1;
    let listaActual = 101;
    let indiceFrase = 0;
    let listaFrasesActiva = [];
    
    // Declaración global del motor de voz
    const synth = window.speechSynthesis;
    let indiceSecuencia = 0;
    let reproduciendoActivo = false;
    let modoActualSecuencia = 'EN';

    function seleccionarLibro(numLibro) {
        libroActual = numLibro;
        
        const botonesLibros = document.querySelectorAll('.btn-libro');
        botonesLibros.forEach((btn, index) => {
            if ((index + 1) === numLibro) {
                btn.classList.add('activo');
            } else {
                btn.classList.remove('activo');
            }
        });

        let inicioLista = numLibro * 100 + 1;
        let finLista = inicioLista + 29;

        const contenedorListas = document.getElementById('contenedor-listas');
        contenedorListas.innerHTML = '';

        for (let i = inicioLista; i <= finLista; i++) {
            const btn = document.createElement('button');
            btn.className = 'btn-lista';
            btn.innerText = `Lista ${i}`;
            btn.onclick = () => cargarLista(i);
            contenedorListas.appendChild(btn);
        }
    }

    function cargarLista(numLista) {
        listaActual = numLista;
        listaFrasesActiva = baseDatosListas[numLista] || baseDatosListas[101];
        indiceFrase = 0;

        document.getElementById('vista-menu').classList.add('oculto');
        document.getElementById('vista-estudio').classList.remove('oculto');
        
        actualizarFraseUI();
    }

    function actualizarFraseUI() {
        document.getElementById('marcador').innerText = `Frase ${indiceFrase + 1} de ${listaFrasesActiva.length} (Lista ${listaActual})`;
        document.getElementById('ingles').innerText = listaFrasesActiva[indiceFrase].en;
        document.getElementById('espanol').innerText = listaFrasesActiva[indiceFrase].es;
        
        document.getElementById('ingles').style.display = 'none';
        document.getElementById('espanol').style.display = 'none';
    }

    function mostrarIngles() {
        const el = document.getElementById('ingles');
        el.style.display = el.style.display === 'none' ? 'flex' : 'none';
    }

    function mostrarEspanol() {
        const el = document.getElementById('espanol');
        el.style.display = el.style.display === 'none' ? 'flex' : 'none';
    }

    function siguienteFrase() {
        if (indiceFrase < listaFrasesActiva.length - 1) {
            indiceFrase++;
            actualizarFraseUI();
        }
    }

    function anteriorFrase() {
        if (indiceFrase > 0) {
            indiceFrase--;
            actualizarFraseUI();
        }
    }

    function volverAlMenu() {
        reproduciendoActivo = false;
        synth.cancel();
        document.getElementById('vista-estudio').classList.add('oculto');
        document.getElementById('vista-secuencial').classList.add('oculto');
        document.getElementById('vista-menu').classList.remove('oculto');
    }

    function volverAEstudio() {
        reproduciendoActivo = false;
        synth.cancel();
        document.getElementById('vista-secuencial').classList.add('oculto');
        document.getElementById('vista-estudio').classList.remove('oculto');
    }

    function abrirVistaSecuencial() {
        document.getElementById('vista-estudio').classList.add('oculto');
        document.getElementById('vista-secuencial').classList.remove('oculto');
        document.getElementById('info-secuencial').innerText = `Libro ${libroActual} - Lista ${listaActual}`;
    }

    function leerIngles() {
        synth.cancel();
        const texto = listaFrasesActiva[indiceFrase].en;
        const utterance = new SpeechSynthesisUtterance(texto);
        utterance.lang = 'en-US';
        synth.speak(utterance);
    }

    function leerEspanol() {
        synth.cancel();
        const texto = listaFrasesActiva[indiceFrase].es;
        const utterance = new SpeechSynthesisUtterance(texto);
        utterance.lang = 'es-ES';
        synth.speak(utterance);
    }

    function ocultarTextoSecuencial() {
        document.getElementById('contenedor-visualizacion').classList.add('oculto');
    }

    function visualizarTexto(modo) {
        const contenedor = document.getElementById('contenedor-visualizacion');
        contenedor.classList.remove('oculto');
        contenedor.innerHTML = '';

        listaFrasesActiva.forEach((item, idx) => {
            const div = document.createElement('div');
            div.className = 'item-visualizado';
            if (modo === 'EN') div.innerText = `${idx + 1}. ${item.en}`;
            if (modo === 'ES') div.innerText = `${idx + 1}. ${item.es}`;
            if (modo === 'EN-ES') div.innerText = `${idx + 1}. ${item.en} — ${item.es}`;
            if (modo === 'ES-EN') div.innerText = `${idx + 1}. ${item.es} — ${item.en}`;
            contenedor.appendChild(div);
        });
    }

    function reproducirSecuencia(modo) {
        modoActualSecuencia = modo;
        indiceSecuencia = 0; // Reinicia al principio al pulsar un botón verde nuevo
        iniciarBucleReproduccion();
    }

    function reanudarAudio() {
        if (!reproduciendoActivo) {
            iniciarBucleReproduccion(); // Retoma exactamente desde la frase donde se pausó
        }
    }

    function iniciarBucleReproduccion() {
        synth.cancel();
        if (listaFrasesActiva.length === 0) return;

        reproduciendoActivo = true;

        const velocidad = parseFloat(document.getElementById('velocidad-lectura').value) || 1;
        const vozEnLang = document.getElementById('select-voz-en').value || 'en-US';
        const vozEsLang = document.getElementById('select-voz-es').value || 'es-ES';
        const modo = modoActualSecuencia;

        function reproducirSiguiente() {
            if (!reproduciendoActivo || indiceSecuencia >= listaFrasesActiva.length) {
                reproduciendoActivo = false;
                return;
            }

            const fraseObj = listaFrasesActiva[indiceSecuencia];
            
            if (modo === 'EN') {
                hablarTexto(fraseObj.en, vozEnLang, velocidad, () => {
                    indiceSecuencia++;
                    reproducirSiguiente();
                });
            } else if (modo === 'ES') {
                hablarTexto(fraseObj.es, vozEsLang, velocidad, () => {
                    indiceSecuencia++;
                    reproducirSiguiente();
                });
            } else if (modo === 'EN-ES') {
                hablarTexto(fraseObj.en, vozEnLang, velocidad, () => {
                    if (!reproduciendoActivo) return;
                    hablarTexto(fraseObj.es, vozEsLang, velocidad, () => {
                        indiceSecuencia++;
                        reproducirSiguiente();
                    });
                });
            } else if (modo === 'ES-EN') {
                hablarTexto(fraseObj.es, vozEsLang, velocidad, () => {
                    if (!reproduciendoActivo) return;
                    hablarTexto(fraseObj.en, vozEnLang, velocidad, () => {
                        indiceSecuencia++;
                        reproducirSiguiente();
                    });
                });
            }
        }

        reproducirSiguiente();
    }

    function hablarTexto(texto, lang, velocidad, onEndCallback) {
        if (!reproduciendoActivo) return;
        let utter = new SpeechSynthesisUtterance(texto);
        utter.lang = lang;
        utter.rate = velocidad;
        utter.onend = () => {
            if (onEndCallback) onEndCallback();
        };
        utter.onerror = () => {
            if (onEndCallback) onEndCallback();
        };
        synth.speak(utter);
    }

    function pausarAudio() {
        reproduciendoActivo = false;
        synth.cancel(); // Detiene el sonido limpiamente y mantiene el índice listo para reanudar
    }
</script>
