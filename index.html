    {es: "Tú tampoco.", en: "Neither would you."},
    {es: "No hablemos de cosas así.", en: "Let's not talk about things like that."},
    {es: "Esta conversación es un callejón sin salida.", en: "This conversation is a dead-end street."},
    {es: "No estamos llegando a ninguna parte.", en: "We're not getting anywhere."},
    {es: "Puedo traducir con facilidad esas cosas.", en: "I can translate those things with ease."},
    {es: "Tu corbata no hace juego con tu traje.", en: "Your tie doesn't match your suit."},
    {es: "Ya sé que no.", en: "I know it doesn't."},
    {es: "Entonces ¿por qué la llevas puesta?", en: "Then why are you wearing it?"},
    {es: "Porque me gusta destacar.", en: "Because I like to stand out."},
    {es: "La gente se burla de ti.", en: "People make fun of you."},
    {es: "¡A mí qué me importa!", en: "What do I care!"},
    {es: "El chismorreo no me molesta.", en: "Gossip doesn't bother me."},
    {es: "Me gano la vida vendiendo coches usados.", en: "I make a living selling used cars."},
    {es: "A ese precio, es una auténtica ganga.", en: "At that price, it's a real bargain."},
    {es: "Esto nos perjudica nuestra capacidad para competir.", en: "This hampers our ability to compete."},
    {es: "Se me pinchó una rueda.", en: "I had a flat tire, (a puncture)"},
    {es: "No tenía rueda de repuesto.", en: "I didn't have a spare tire."},
    {es: "Tardé una hora en resolver el problema.", en: "It took me an hour to solve the problem."},
    {es: "Un camionero paró para ayudarme.", en: "A truck driver stopped to help me."},
    {es: "Si no hubiera parado, aún estaría allí.", en: "If he hadn't stopped, I'd still be there."},
    {es: "Menos mal que paró.", en: "It's a good thing he stopped."},
    {es: "Menos mal que hay gente como él.", en: "It's a good thing there are people like him."},
    {es: "Pasemos a la lista siguiente.", en: "Let's go on to the following list."}
],
403: [
    {es: "¿Qué desea Ud. tomar?", en: "What would you like to have?"},
    {es: "Quiero un filete con patatas.", en: "I want a steak and potatoes."},
    {es: "¿Cómo quiere su filete?", en: "How do you want your steak?"},
    {es: "Bien hecho por favor.", en: "Well done please."},
    {es: "Poco hecho por favor.", en: "Rare please."},
    {es: "En su punto.", en: "Medium rare."},
    {es: "¿Quiere patatas fritas o patata asada?", en: "Would you like French fries or a baked potato?"},
    {es: "¿Me puede traer la cuenta, por favor?", en: "Can you bring me the bill please?"},
    {es: "Nos ha cobrado algo que no pedimos.", en: "You charged us for something we didn't order."},
    {es: "¿Lo pagará en metálico o con tarjeta?", en: "Will you pay in cash or by card?"},
    {es: "Su tarjeta ha caducado.", en: "Your card is expired."},
    {es: "No aceptamos talones.", en: "We don't accept checks."},
    {es: "Vuelvo en 20 minutos.", en: "I'll be back in 20 minutes."},
    {es: "El accidente la dejó más débil.", en: "The accident left her weaker."},
    {es: "Pero fortaleció sus ganas de vivir.", en: "But it strengthened her will to live."},
    {es: "Sabía que nunca volvería a tener miedo.", en: "She knew she'd never be afraid again."},
    {es: "Tendrás que dar marcha atrás para salir.", en: "You'll have to back up to leave."},
    {es: "Mételo en segunda para arrancar.", en: "Put it in second gear to start."},
    {es: "Tienes que quitar el freno de mano.", en: "You have to release the hand brake."},
    {es: "Tienes que usar el embrague para cambiar de marcha.", en: "You have to use the clutch to change gears."},
    {es: "Manten las dos manos en el volante.", en: "Keep both hands on the steering wheel."},
    {es: "No te acerques demasiado a ese coche.", en: "Don't get too close to that car."},
    {es: "Mira atrás antes de cambiar de carril.", en: "Look back before changing lanes."},
    {es: "Tengo que mantener a mi familia.", en: "I have to support my family."},
    {es: "Me cuesta llegar a fin de mes.", en: "I have trouble getting to the end of the month."},
    {es: "Me castigan por cada error que cometo.", en: "They punish me for every mistake I make."},
    {es: "Más vale tarde que nunca.", en: "It's better late than never."},
    {es: "Más vale pájaro en mano que ciento volando.", en: "A bird in hand's better than two in the bush."},
    {es: "Por mucho que trabajes, no te subirán el sueldo.", en: "No matter how hard you work, they won't raise your salary."},
    {es: "Dale la vuelta.", en: "Turn it over."},
    {es: "Humedece el sello antes de pegarlo.", en: "Moisten the stamp before sticking it on."},
    {es: "Sigue de frente.", en: "Keep going straight."},
    {es: "Cuando yo vuelva, tendré tiempo de sobra.", en: "When I come back, I'll have plenty of time."},
    {es: "Me siento mareado, (vértigo)", en: "I feel dizzy."},
    {es: "Tengo el estómago revuelto.", en: "I have an upset stomach."},
    {es: "Creo que voy a devolver.", en: "I think I'm going to throw up."},
    {es: "Toma un sorbo de esto.", en: "Have a sip of this."},
    {es: "Descuida, no quiero envenenarte.", en: "Don't worry; I don't want to poison you."},
    {es: "Diles que le digan que venga aquí.", en: "Tell them to tell him to come here."},
    {es: "Les dije que le dijeran que viniera aquí.", en: "I told them to tell him to come here."},
    {es: "Pues no ha venido.", en: "Well he hasn't come."},
    {es: "Por lo visto no se lo dijeron.", en: "Apparently they didn't tell him."},
    {es: "Estamos metidos en una buen lío.", en: "We're in trouble."},
    {es: "Venga, no es para tanto.", en: "Come on, it's not that bad."},
    {es: "Eso te lo crees tú.", en: "That's what you think."},
    {es: "Eres un caso perdido.", en: "You're a lost case."},
    {es: "Al contrario, soy un realista.", en: "On the contrary, I'm a realist."},
    {es: "Sólo ves el lado malo de las cosas.", en: "You only see the bad side of things."},
    {es: "Lo siento pero así soy.", en: "I'm sorry but that's the way I am."},
    {es: "Anda, anímate.", en: "Come no, cheer up."}
],
404: [
    {es: "Todo saldrá bien, ya verás.", en: "Everything will turn out fine, you'll see."},
    {es: "Si hubieras venido, habríamos ganado.", en: "If you had come, we would've won."},
    {es: "El ganar no es lo más importante.", en: "Winning's not the most important thing."},
    {es: "Pero es mejor que perder.", en: "But it's better than losing."},
    {es: "Les venceremos.", en: "We'll defeat them."},
    {es: "No tienen salida.", en: "They have no escape."},
    {es: "Están atrapados.", en: "They're trapped."},
    {es: "No hay ninguna forma de que puedan ganar.", en: "There's no way they can win."},
    {es: "Nuestros jugadores son mejores que los de ellos.", en: "Our players are better than theirs."},
    {es: "¡No me digas!", en: "You don't say!"},
    {es: "Siempre te estás quejando.", en: "You're always complaining."},
    {es: "Todo el mundo trata de complacerte.", en: "Everyone tries to please you."},
    {es: "Agradezco todo lo que habéis hecho.", en: "I appreciate everything you've done."},
    {es: "No sé lo que habría hecho si no hubiera sido por vuestra ayuda.", en: "I don't know what I would've done if it hadn't been for your help."},
    {es: "Los espantapájaros no espantan a los pájaros.", en: "Scarecrows don't scare away the birds."},
    {es: "El mío sí.", en: "Mine does."},
    {es: "¿Por qué el tuyo sí?", en: "Why does yours?"},
    {es: "Porque se basa en una nueva tecnología.", en: "Because it's based on a new technology."},
    {es: "¿Qué clase de tecnología es esa?", en: "What kind of technology is that?"},
    {es: "Ato a mi hijo mayor al poste.", en: "I tie my older son to the post."},
    {es: "¿Y los pájaros le toman en serio?", en: "And the birds take him seriously?"},
    {es: "Le toman muy en serio.", en: "They take him very seriously."},
    {es: "¿Qué hace?", en: "What does he do?"},
    {es: "Les dispara con una escopeta.", en: "He shoots at them with a shotgun."},
    {es: "Nadar está prohibido durante marea alta.", en: "Swimming's prohibited during high tide."},
    {es: "La luna influye en las mareas.", en: "The moon influences the tides."},
    {es: "El consejo de administración aprobó el nuevo presupuesto.", en: "The board of directors approved the new budget."},
    {es: "Las previsiones de ventas son buenas.", en: "The sales forecasts are good."},
    {es: "Nos vamos a forrar.", en: "We're going to make a killing."},
    {es: "Me duele la muela.", en: "I have a toothache."},
    {es: "Me duele la garganta.", en: "I have a sore throat."},
    {es: "¡Cuidado!", en: "Look out!"},
    {es: "Menos mal que te agachaste.", en: "It's a good thing you ducked."},
    {es: "¿Tenía que haberme agachado?", en: "Was I supposed to have ducked?"},
    {es: "Fallaron por un pelo.", en: "They missed by a hair."},
    {es: "La echo mucho de menos.", en: "I miss her very much."},
    {es: "No puedo continuar sin ella.", en: "I can't go on without her."},
    {es: "Ella es mi inspiración.", en: "She's my inspiration."},
    {es: "Él no puede guardar un secreto.", en: "He can't keep a secret."},
    {es: "Es un bocazas.", en: "He's a big mouth."},
    {es: "Nadie le aguanta.", en: "Nobody can stand him."},
    {es: "Se comporta como un niño.", en: "He behaves like a child."},
    {es: "Tiene rabietas cuando no consigue lo que quiere.", en: "He has tantrums when he doesn't get what he wants."},
    {es: "Tiene un tornillo flojo.", en: "He has a loose screw."},
    {es: "Pierde los estribos a menudo.", en: "He loses his temper often."},
    {es: "Algunas personas le tienen miedo.", en: "Some people are afraid of him."},
    {es: "Le gusta intimidar a la gente.", en: "He likes to intimidate people."},
    {es: "Siempre se sale con la suya.", en: "He always gets his way."},
    {es: "Es una pesado.", en: "He's a pain in the neck."},
    {es: "Algún día le echarán de aquí.", en: "Someday they'll kick him out of here."}
],
405: [
    {es: "No preveo ningún problema.", en: "I don't foresee any problems."},
    {es: "No podemos subir el ancla.", en: "We can't raise the anchor."},
    {es: "Se rompió la cuerda.", en: "The rope broke."},
    {es: "Abrocha tu cinturón de seguridad.", en: "Fasten your seat belt."},
    {es: "Le cogieron con las manos en la masa.", en: "They caught him red-handed."},
    {es: "Pagaron por sus pecados.", en: "They paid for their sins."},
    {es: "Reconozco que no hice un esfuerzo.", en: "I admit I didn't make an effort."},
    {es: "Le castigaron con una látigo.", en: "They punished him with a whip."},
    {es: "No juzgues el libro por la cubierta.", en: "Don't judge the book by the cover."},
    {es: "Más vale prevenir que curar.", en: "It's better to be safe than sorry."},
    {es: "Prefiero dibujos animados a esto.", en: "I prefer cartoons to this."},
    {es: "Esos colores no casan.", en: "Those colours don't match."},
    {es: "Están avergonzados de tu comportamiento.", en: "They're ashamed of your behaviour."},
    {es: "Se sienten muy decepcionados.", en: "They feel very disappointed."},
    {es: "Usaste leguaje muy ofensivo.", en: "You used very offensive language."},
    {es: "¿Sabes medir la altura de un edificio?", en: "Do you know how to measure the height of a building?"},
    {es: "¿Sabes medirlo con un barómetro?", en: "Do you know how to measure it with a barometer?"},
    {es: "Claro que sé hacerlo.", en: "Of course I know how to do it."},
    {es: "Primero voy a la casa del arquitecto.", en: "First I go to the architect's house."},
    {es: "Después le digo lo siguiente:", en: "Then I tell him the following:"},
    {es: "Si me dice Ud. la altura de su edificio, le daré este bonito barómetro.", en: "If you tell me the height of your building, I'll give you this pretty barometer."},
    {es: "No seas gracioso.", en: "Don't be funny."},
    {es: "¿Se te ocurre una forma mejor?", en: "Does a better way occur to you?"},
    {es: "Entonces no me hagas preguntas tontas.", en: "Then don't ask me silly questions."},
    {es: "Frótalo con algodón.", en: "Rub it with cotton."},
    {es: "¿Dónde voy a encontrar algodón?", en: "Where am I going to find cotton?"},
    {es: "Mira en el botiquín.", en: "Look in the first-aid kit."},
    {es: "Lo encontrarás en el estante superior.", en: "You'll find it on the top shelf."},
    {es: "No lo puedo alcanzar.", en: "I can't reach it."},
    {es: "Súbete a esta silla.", en: "Get on this chair."},
    {es: "Lo haré si me la sujetas.", en: "I'll do it if you hold it for me."},
    {es: "Tienes miedo de tu propia sombra.", en: "You're afraid of your own shadow."},
    {es: "Hay una grieta en el hormigón.", en: "There's a crack in the concrete."},
    {es: "El hormigón es una mezcla de arena y cemento.", en: "Concrete is a mixture of sand and cement."},
    {es: "Creo que me estoy enamorando.", en: "I think I'm falling in love."},
    {es: "No me hagas reír.", en: "Don't make me laugh."},
    {es: "En serio, nunca me he sentido así.", en: "Seriously, I've never felt this way."},
    {es: "No eres capaz de amar a nadie.", en: "You're not capable of loving anyone."},
    {es: "¡Muchas gracias! Eres una gran ayuda.", en: "Thanks a lot! You're a big help."},
    {es: "Eres incapaz de sentir emoción.", en: "You're incapable of feeling emotion."},
    {es: "Eso es lo último que esperaba oír de ti.", en: "That's the last thing I expected to hear from you."},
    {es: "¿Cómo van las cosas con María?", en: "How are things going with Mary?"},
    {es: "Hemos roto.", en: "We've broken up."},
    {es: "Ella cree que no soy lo suficientemente inteligente.", en: "She thinks I'm not intelligent enough."},
    {es: "Tiene razón.", en: "She's right."},
    {es: "Así que estás de acuerdo con ella.", en: "So you agree with her."},
    {es: "Bueno, digamos que no eres un genio.", en: "Well, let's say you're not a genius."},
    {es: "Tú tampoco.", en: "Neither are you."},
    {es: "Pero al menos lo reconozco.", en: "But at least I admit it."},
    {es: "Sé cuales son mis limitaciones.", en: "I know what my limitations are."}
],
406: [
    {es: "¿Qué opinas de esta situación?", en: "What do you think about this situation?"},
    {es: "¿Qué quieres que diga?", en: "What do you want me to say?"},
    {es: "Lo que sea.", en: "Anything."},
    {es: "Creo que no vale la pena.", en: "I think it's not worth it."},
    {es: "O sea, no lo deberíamos hacer.", en: "In other words, we shouldn't do it."},
    {es: "Creo que sería demasiado arriesgado.", en: "I think it would be too risky."},
    {es: "Nada arriesgado, nada ganado.", en: "Nothing risked, nothing gained."},
    {es: "Sí, pero en este caso, el riesgo es alto.", en: "Yes, but in this case, the risk is high."},
    {es: "Puede que tengas razón.", en: "You may be right."},
    {es: "¿Cuánto vais a invertir en el proyecto?", en: "How much are you going to invest in the project?"},
    {es: "Todos nuestros ahorros.", en: "All our savings."},
    {es: "¿Y si fracasáis?", en: "And if you fail?"},
    {es: "Es imposible que fracasemos.", en: "It's impossible for us to fail."},
    {es: "¿Cuál es vuestro secreto para el éxito?", en: "What's your secret for success?"},
    {es: "Somos muy trabajadores.", en: "We're very hard working."},
    {es: "Hace falta mucho más que eso.", en: "It takes a lot more than that."},
    {es: "Hace falta perseverancia.", en: "It takes perseverance."},
    {es: "Hace falta pericia.", en: "It takes expertise."},
    {es: "Hace falta fuerza de voluntad.", en: "It takes will-power."},
    {es: "Y hace falta un poco de suerte.", en: "And it takes a little bit of luck."},
    {es: "No necesitamos nada de eso.", en: "We don't need any of that."},
    {es: "Entonces ¿cómo vais a tener éxito?", en: "Then how are you going to succeed?"},
    {es: "Tenemos un producto que se vende a sí mismo.", en: "We have a product that sells itself."},
    {es: "Es una poción para los calvos.", en: "It's a potion for bald people."},
    {es: "Hace que el pelo crezca un centímetro por semana.", en: "It makes hair grow a centimetre a week."},
    {es: "Ya tenemos un pedido de China.", en: "We already have an order from China."},
    {es: "Tenemos que embarcar un millón de frascos para dentro de un mes.", en: "We have to ship a million bottles within a month."},
    {es: "¿Los tenéis en stock?", en: "Do you have them in stock?"},
    {es: "No los hemos empezado a fabricar aún.", en: "We haven't started producing them yet."},
    {es: "¡Estáis locos! ¿Cómo vais a fabricarlos?", en: "You're crazy? How are you going to produce them?"},
    {es: "Por eso te he llamado.", en: "That's why I called you."},
    {es: "¿Qué tengo yo que ver con esto?", en: "What do I have to do with this?"},
    {es: "Pensé que a lo mejor querrías ayudarnos.", en: "I thought you might want to help us."},
    {es: "¿Ayudaros a hacer qué?", en: "Help you do what?"},
    {es: "A financiar la producción.", en: "To finance the production."},
    {es: "¿Desde cuando soy yo un banco?", en: "Since when am I a bank?"},
    {es: "Pero tienes mucho dinero.", en: "But you have a lot of money."},
    {es: "Pero no para tus locas ideas.", en: "But not for your crazy ideas."},
    {es: "¿Sabes cuántos chinos son calvos?", en: "Do you know how many Chinese people are bald?"},
    {es: "340 millones de chinos querrán nuestro producto.", en: "340 million Chinese people will want our product."},
    {es: "Multiplica eso por 3 dólares por frasco.", en: "Multiply that by 3 dollars a bottle."},
    {es: "¿Cuánto dinero crees que necesitaréis?", en: "How much money do you think you'll need?"},
    {es: "Ochenta mil pavos.", en: "80 thousand bucks."},
    {es: "Bueno, veré lo que pueda hacer.", en: "Well, I'll see what I can do."},
    {es: "¡Pero estás forrado!", en: "But you're filthy rich!"},
    {es: "Puedes conseguir el dinero en una hora.", en: "You can get the money in an hour."},
    {es: "¡Oye, el dinero no crece en los árboles!", en: "Hey, money doesn't grow on trees!"},
    {es: "Tengo que consultar con mi asesor fiscal.", en: "I have to consult my tax advisor."},
    {es: "¿Qué tiene él que ver con esto?", en: "What does he have to do with this?"},
    {es: "No puedo darte 80 mil pavos así por las buenas.", en: "I can't give you 80 thousand bucks just like that."}
],
407: [
    {es: "¿Cómo se siente ser millonario?", en: "How does it feel to be a millionaire?"},
    {es: "Me siento igual que siempre.", en: "I feel the same as always."},
    {es: "Creí que tendría más tiempo libre.", en: "I thought I'd have more free time."},
    {es: "¿Te das cuenta ahora?", en: "Now do you realise?"},
    {es: "Los ricos tienen problemas también.", en: "Rich people have problems too."},
    {es: "Pero es mejor que ser pobre.", en: "But it's better than being poor."},
    {es: "Tal vez, pero no estoy tan seguro.", en: "Maybe so, but I'm not so sure."},
    {es: "Has tenido mucho éxito.", en: "You've been very successful."},
    {es: "Ahora que eres rico y famoso, ¿qué vas a hacer con tu vida?", en: "Now that you're rich and famous, what are you going to do with your life?"},
    {es: "Voy a realizar todos mis sueños.", en: "I'm going to fulfil all my dreams."},
    {es: "No pierdas tu sentido de la dirección.", en: "Don't lose your sense of direction."},
    {es: "El pavimento está resbaladizo.", en: "The pavement is slippery."},
    {es: "Te puedes resbalar fácilmente.", en: "You can slip easily."},
    {es: "Besaros y haced las paces.", en: "Kiss and make up."},
    {es: "Ella lleva mucho maquillaje.", en: "She wears a lot of makeup."},
    {es: "¿Cómo puedo compensar por lo que hice?", en: "How can I make up for what I did?"},
    {es: "Esta es una clase de recuperación.", en: "This is a makeup class."},
    {es: "Él inventó una historia.", en: "He made up a story."},
    {es: "Decídete.", en: "Make up your mind."},
    {es: "El comité está compuesto por 3 personas.", en: "The committee is made up of 3 people."},
    {es: "Tengo que recuperar el tiempo perdido.", en: "I have to make up for the lost time."},
    {es: "¿Cómo te lo puedo enmendar?", en: "How can I make it up to you?"},
    {es: "Confeccionemos una lista de temas.", en: "Let's make up a list of subjects."},
    {es: "Estoy completamente desmoralizado.", en: "I'm completely demoralised."},
    {es: "¿Qué ocurre?", en: "What's the matter?"},
    {es: "Creí que tenía el inglés dominado.", en: "I thought I had English mastered."},
    {es: "Todavía tienes mucho camino por recorrer.", en: "You still have a long way to go."},
    {es: "Sobre todo con verbos y preposiciones.", en: "Especially with verbs and prepositions."},
    {es: "No sabía que \"make up\" tenía tantos usos.", en: "I didn't know \"make up\" had so many uses."},
    {es: "Verás que hay centenares de ejemplos con ése.", en: "You'll see that there are hundreds of examples like that one."},
    {es: "Me rindo.", en: "I give up."},
    {es: "Te dije que iba a ser difícil.", en: "I told you it was going to be difficult."},
    {es: "Me dijiste que querías un reto.", en: "You told me you wanted a challenge."},
    {es: "Te lo advertí.", en: "I warned you (about it)."},
    {es: "Sabías que no sería un lecho de rosas.", en: "You knew it wouldn't be a bed of roses."},
    {es: "Aprender un idioma requiere sangre, sudor y lágrimas.", en: "Learning a language requires blood, sweat and tears."},
    {es: "Tienes que estar encima de todo.", en: "You have to be on top of everything."},
    {es: "No puedes bajar la guardia.", en: "You can't lower your guard."},
    {es: "Tienes que demostrar agilidad mental.", en: "You have to show mental agility."},
    {es: "No sé si estoy por la labor.", en: "I don't know if I'm up to the task."},
    {es: "Anda, anímate. No te desanimes.", en: "Come on, cheer up! Don't get discouraged."},
    {es: "¡Pero hay tanto que aprender!", en: "But there's so much to learn!"},
    {es: "No lograrás nada si abandonas ahora.", en: "You won't accomplish anything if you give up now."},
    {es: "¿De verdad crees que soy capaz de aprender todas estas cosas?", en: "Do you really think I'm capable of learning all these things?"},
    {es: "Por supuesto que sí.", en: "Of course I do."},
    {es: "Entonces sigamos adelante.", en: "Then let's move on."},
    {es: "Ahora es la hora de la verdad.", en: "Now is the moment of truth."},
    {es: "No quiero volver a verte desmoralizado.", en: "I don't want to see you demoralised again."},
    {es: "Tienes mi palabra.", en: "You have my word."},
    {es: "Bueno pues, allá vamos...", en: "Well then, here we go..."}
],
408: [
    {es: "Guarda tus juguetes.", en: "Put away your toys."},
    {es: "Te guardaré una copia.", en: "I'll save a copy for you."},
    {es: "Apaga la vela.", en: "Blow out the candle."},
    {es: "Tuve un reventón camino de la oficina.", en: "I had a blow out on the way to work."},
    {es: "Intentaron volar el puente.", en: "They tried to blow up the bridge."},
    {es: "Estoy cansado de inflar globos.", en: "I'm tired of blowing up balloons."},
    {es: "Suénate.", en: "Blow your nose."},
    {es: "Fue un golpe bajo.", en: "It was a low blow."},
    {es: "Tocaron el silbato.", en: "They blew the whistle."},
    {es: "Ganábamos por 10 puntos y en el último minuto lo fastidiamos.", en: "We were winning be 10 points and in the last minute we blew it."},
    {es: "Él perdió los estribos.", en: "He blew his top."},
    {es: "El viento derribó el muro.", en: "The wind blew down the wall."},
    {es: "El viento lo derribó.", en: "The wind blew it down."},
    {es: "No te preocupes, ella sólo está desfogándose.", en: "Don't worry; she's only blowing off steam."},
    {es: "La tormenta pasó sin descargar.", en: "The storm blew over."},
    {es: "Apaga la luz.", en: "Turn off the light, (switch off)"},
    {es: "Apaga el incendio.", en: "Put out the fire."},
    {es: "Apaga la vela.", en: "Blow out the candle."},
    {es: "¡Tiempo!", en: "Time out!"},
    {es: "¿Qué pasa?", en: "What's the matter?"},
    {es: "Déjame descansar un minuto.", en: "Let me rest for a minute."},
    {es: "Esos verbos me están volviendo loca.", en: "Those verbs are driving my crazy."},
    {es: "¡Anda, no es para tanto!", en: "Come on, it's not that bad!"},
    {es: "Pareces disfrutar torturándome.", en: "You seem to enjoy torturing me."},
    {es: "Tomemos un descanso.", en: "Let's take a break."},
    {es: "Relájate.", en: "Relax."},
    {es: "¿Por qué no te quitas esos horribles pendientes?", en: "Why don't you take off those horrible earrings?"},
    {es: "Estás mejor sin ellos.", en: "You look better without them."},
    {es: "Pareces cansada.", en: "You look tired."},
    {es: "¿Quieres que te traiga algo de beber?", en: "Do you want me to bring you something to drink?"},
    {es: "Estoy bien, pero me pica la espalda.", en: "I'm okay, but my back itches."},
    {es: "Te la rascaré si quieres.", en: "I'll scratch it for you if you want."},
    {es: "¿Dónde te pica?", en: "Where does it itch?"},
    {es: "Un poco más abajo.", en: "A little lower."},
    {es: "¡Oye, he dicho un poco más abajo!", en: "Hey! I said a little lower."},
    {es: "No te pongas fresco conmigo.", en: "Don't get fresh with me."},
    {es: "But don't you like me to scratch your back?", en: "Pero ¿no te gusta que te rasque la espalda?"},
    {es: "Bueno, sigue, pero contrólate.", en: "Okay, go on, but control yourself."},
    {es: "¿Qué tal así?", en: "How's that?"},
    {es: "Me das escalofríos.", en: "You give me the shivers."},
    {es: "Así que te gusta.", en: "So you like it."},
    {es: "No estoy hecha de piedra.", en: "I'm not made of stone."},
    {es: "Bueno, es hora de volver a la lección.", en: "Well, it's time to get back to the lesson."},
    {es: "No me apetece estudiar ahora.", en: "I don't feel like studying now."},
    {es: "¿Qué te apetece hacer?", en: "What do you feel like doing?"},
    {es: "Quiero que sigas rascándome la espalda.", en: "I want you to go on scratching my back."},
    {es: "Te están saliendo los colores.", en: "You're blushing, (turning red)"},
    {es: "¿Qué esperas?", en: "What do you expect?"},
    {es: "¿Volvemos a la lección?", en: "Shall we get back to the lesson?"},
    {es: "Cállate tonto y sigue rascando.", en: "Shut up silly and keep scratching."}
],
409: [
    {es: "Tienes la camiseta puesta al revés.", en: "You have your T-shirt on backwards."},
    {es: "Quítatela.", en: "Take it off."},
    {es: "Póntela de esta manera.", en: "Put it on this way."},
    {es: "Se supone que lo llevas de esta forma.", en: "You're supposed to wear it this way."},
    {es: "Menos mal que te diste cuenta.", en: "It's a good thing you realised."},
    {es: "Soy muy observadora.", en: "I'm very observant."},
    {es: "Presto atención a los detalles.", en: "I pay attention to details."},
    {es: "¿Has puesto el despertador?", en: "Have you set the alarm clock?"},
    {es: "¿A qué hora sonará?", en: "What time will it go off?"},
    {es: "Se me pegaron las sábanas esta mañana.", en: "I overslept this morning."},
    {es: "No puedes permitirte el lujo de quedarte dormido.", en: "You can't afford to oversleep."},
    {es: "No soporto madrugar.", en: "I can't stand getting up early."},
    {es: "Me cuesta horrores levantarme.", en: "I have a terrible time getting up."},
    {es: "Tardo una hora en despejarme la cabeza.", en: "It takes me an hour to clear my head."},
    {es: "Dejo el despertador en el baño.", en: "I leave the alarm clock in the bathroom."},
    {es: "Ese me obliga a levantarme para apagarlo.", en: "That forces me to get up to turn it off."},
    {es: "No lo soporto cuando suena.", en: "I can't stand it when it goes off."},
    {es: "Es un sonido que me vuelve loco.", en: "It's a sound that drives my crazy."},
    {es: "¿Sigues buscando un empleo?", en: "Are you still looking for a job?"},
    {es: "Lo he dejado.", en: "I've given up."},
    {es: "¿Cómo piensas mantener a tu familia?", en: "How do you plan to support your family?"},
    {es: "Viviré del sueldo de mi mujer.", en: "I'll live off my wife's salary."},
    {es: "¿Qué opina ella de eso?", en: "What does she think about that?"},
    {es: "No hablemos de mi mujer.", en: "Let's not talk about my wife."},
    {es: "Estoy harto de la vida de casado.", en: "I'm sick of married life."},
    {es: "No lo aguanto.", en: "I can't stand it."},
    {es: "Ella cree que me puede dar órdenes.", en: "She thinks she can order me around."},
    {es: "¿Quién cree que es?", en: "Who does she think she is?"},
    {es: "Le voy a dar un escarmiento.", en: "I'm going to teach her a lesson."},
    {es: "Pero es ella quien te mantiene.", en: "But she's the one who supports you."},
    {es: "Eso es como debe ser.", en: "That's as it should be."},
    {es: "Llevo a los niños al colegio.", en: "I take the children to school."},
    {es: "Hago los quehaceres domésticos.", en: "I do the housework."},
    {es: "Ayudo a los niños con sus deberes.", en: "I help the kids with their homework."},
    {es: "Trabajo más ahora que antes.", en: "I work harder now than before."},
    {es: "Antes trabajaba ocho horas al día.", en: "I used to work eight hours a day."},
    {es: "Ahora nunca paro.", en: "Now I never stop."},
    {es: "Incluso limpio la bañera.", en: "I even clean the bathtub."},
    {es: "Es un trabajo interminable.", en: "It's a never-ending job."},
    {es: "En cuanto terminas una cosa tienes que empezar con otra.", en: "As soon as you finish one thing you have to start on something else."},
    {es: "Al final del día estoy completamente agotado.", en: "At the end of the day I'm completely exhausted."},
    {es: "No tengo ganas de hacer nada.", en: "I don't feel like doing anything."},
    {es: "Los niños dejan todo en el suelo.", en: "The kids leave everything on the floor."},
    {es: "Tengo que recoger detrás de ellos.", en: "I have to pick up after them."},
    {es: "La mitad de las veces mi mujer llega a casa de mal humor.", en: "Half the time my wife gets home in a bad mood."},
    {es: "Tiene la cara de pedirme que haga la cena.", en: "She has the nerve to ask me to make dinner."},
    {es: "Menos mal que soy pésimo cocinero.", en: "It's a good thing I'm a lousy cook."},
    {es: "Si no, tendría que hacer la cena todas las noches.", en: "Otherwise I'd have to make dinner every night."},
    {es: "Tenéis los papeles invertidos.", en: "Your roles are reversed."},
    {es: "La vida de un ama de casa es pesada.", en: "A housewife's job is a pain in the neck."}
],
410: [
    {es: "Salgamos de paseo.", en: "Let's go out for a walk."},
    {es: "Me apetece tomar un poco de aire fresco.", en: "I feel like getting a little fresh air."},
    {es: "¿Quieres acompañarme?", en: "Would you like to come with me?"},
    {es: "Cambíate de zapatos.", en: "Change your shoes."},
    {es: "Esos zapatos están algo gastados.", en: "Those shoes are a little worn out."},
    {es: "Pero los otros me hacen daño a los pies.", en: "But the other ones hurt my feet."},
    {es: "Entonces ponte las playeras.", en: "Then put on your tennis shoes."},
    {es: "Los cordones están rotos.", en: "The shoelaces are broken."},
    {es: "Te compré unos nuevos. ¿No te acuerdas?", en: "I bought you some new ones. Don't you remember?"},
    {es: "¿Dónde los escondiste?", en: "Where did you hide them?"},
    {es: "Están en el cajón superior de tu mesa de noche.", en: "They're in the top drawer of your bedside table, (night table)"},
    {es: "Están encima de la caja donde están los pasaportes.", en: "They're on top of the box where the passports are."},
    {es: "Pues no los veo.", en: "Well I can't see them."},
    {es: "Están delante de tus narices.", en: "They're right in front of you."},
    {es: "Pero estos cordones son para zapatos de vestir.", en: "But these laces are for dress shoes."},
    {es: "Mira debajo del álbum de fotos.", en: "Look under the photo album."},
    {es: "¿Son éstos?", en: "Are these the ones?"},
    {es: "Son para playeras, ¿no?", en: "They're for tennis shoes, aren't they?"},
    {es: "Pero estos cordones son para niños.", en: "But these shoes laces are for children."},
    {es: "¿Qué quieres decir para niños?", en: "What do you mean for children?"},
    {es: "Tienen diminutas barras y estrellas.", en: "They have tiny stars and stripes."},
    {es: "Bueno, póntelos de todas formas.", en: "Well, put them on anyway."},
    {es: "¿Estás loca? Van a pensar que soy pro americano.", en: "Are you crazy? They're going to think I'm pro-American."},
    {es: "¿No lo eres?", en: "Aren't you?"},
    {es: "No hasta este extremo.", en: "Not to this extreme."},
    {es: "Entonces iré de paseo yo sola.", en: "Then I'll go for a walk by myself."},
    {es: "Nunca quieres salir conmigo.", en: "You never want to go out with me."},
    {es: "Siempre estás buscando excusas para no hacer nada.", en: "You're always looking for excuses not to do anything."},
    {es: "Te estás volviendo perezoso.", en: "You're becoming lazy."},
    {es: "Antes hacíamos todo juntos.", en: "We used to do everything together."},
    {es: "Ahora ni siquiera me hablas.", en: "Now you don't even talk to me."},
    {es: "Siempre pareces cansado e irritable.", en: "You always seem tired and irritable."},
    {es: "Ya no parece gustarte nada.", en: "You don't seem to like anything anymore."},
    {es: "¿Por qué no te callas?", en: "Why don't you shut up?"},
    {es: "Siempre te estás metiendo conmigo.", en: "You're always picking at me."},
    {es: "No sé lo que me pasa.", en: "I don't know what's the matter with me."},
    {es: "No quiero discutir contigo.", en: "I don't want to argue with you."},
    {es: "Por cierto, ¿hablaste con tu jefe?", en: "By the way, did you speak to your boss?"},
    {es: "¿Sobre qué?", en: "About what?"},
    {es: "¿No le ibas a pedir un aumento?", en: "Weren't you going to ask him for a raise?"},
    {es: "Es una pérdida de tiempo.", en: "It's a waste of time."},
    {es: "Se están aprovechando de ti.", en: "They're taking advantage of you."},
    {es: "No quiero hablar de eso ahora.", en: "I don't want to talk about that now."},
    {es: "Entonces ¿cuándo vamos a hablar de ello?", en: "Then when are we going to talk about it?"},
    {es: "Mira, déjame en paz, ¿quieres?", en: "Look, leave me alone, will you?"},
    {es: "Vale, si te empeñas.", en: "Okay, if you insist."},
    {es: "Puede que vuelva un poco tarde.", en: "I may be back a little late."},
    {es: "Tengo que pasar por la casa de David.", en: "I have to drop by David's house."},
    {es: "Si tienes hambre, recalienta la pizza de anoche.", en: "If you're hungry, heat up the pizza from last night."},
    {es: "Daré tus recuerdos a David.", en: "I'll give your regards to David."}
],
411: [
    {es: "Ha llegado la hora de tomar una decisión.", en: "The time has come to make a decision."},
    {es: "Ojalá tuviéramos más información.", en: "I wish we had more information."},
    {es: "Eso no cambiaría la situación.", en: "That wouldn't change the situation."},
    {es: "Al menos nos sentiríamos más tranquilos.", en: "At least we'd feel more reassured."},
    {es: "La vida está llena de riesgos.", en: "Life is full of risks."},
    {es: "Es más arriesgado no tomar una decisión.", en: "It's riskier not to make a decision."},
    {es: "Quizás tengas razón.", en: "You may be right."},
    {es: "Confía en mí... sé lo que digo.", en: "Trust me... I know what I'm saying."},
    {es: "Todo saldrá bien.", en: "Everything will turn out okay."},
    {es: "No puedo evitar pensar en los niños.", en: "I can't help thinking about the kids."},
    {es: "Son todavía pequeños... se adaptarán.", en: "They're still little... they'll adapt."},
    {es: "Nunca pensé que llegaríamos a esto.", en: "I never thought we'd come to this."},
    {es: "Deberíamos haber seguido el consejo de mi padre.", en: "We should've followed my father's advice."},
    {es: "Deberíamos haber vendido la casa.", en: "We should've sold the house."},
    {es: "Deberías haberle pedido perdón.", en: "You should've apologised to him."},
    {es: "Le heriste los sentimientos.", en: "You hurt his feelings."},
    {es: "Nos hubiera ayudado si le hubieras tratado bien.", en: "He would've helped us if you had treated him well."},
    {es: "¿Cómo te sentirías tú si te dijeran que eras retrasado mental?", en: "How would you feel if they told you were mentally retarded?"},
    {es: "Tengo que coger un vuelo mañana.", en: "I have to catch a plane tomorrow."},
    {es: "Odio volar.", en: "I hate flying, (can't stand)"},
    {es: "Pero los aviones son muy seguros.", en: "But planes are very safe."},
    {es: "¿Cuál es el momento más peligroso de un vuelo?", en: "What's the most dangerous moment of a flight?"},
    {es: "El viaje de tu casa al aeropuerto.", en: "The trip from your house to the airport."},
    {es: "Ha habido un cambio en el programa.", en: "There's been a schedule change."},
    {es: "Si lo aflojaras podrías sacarlo.", en: "If you loosened it you could take it out."},
    {es: "No puedo respirar con tanto humo.", en: "I can't breathe with so much smoke."},
    {es: "Te vamos a usar como conejo de indias.", en: "We're going to use you as a Guinea pig."},
    {es: "Tenemos una amplia gama de productos.", en: "We have a wide range of products."},
    {es: "Me estás ocultando algo.", en: "You're hiding something from me."},
    {es: "Hasta ahora no ha habido quejas.", en: "So far there haven't been any complaints."},
    {es: "Si hicieras eso, sería injusto.", en: "If you did that, it would be unfair."},
    {es: "Que yo sepa, él no la amenazó.", en: "As far as I know, he didn't threaten her."},
    {es: "No deberías recurrir a amenazas.", en: "You shouldn't resort to threats."},
    {es: "No puedo con este problema.", en: "I can't handle this problem."},
    {es: "Dilo en voz alta.", en: "Say it aloud."},
    {es: "Por un lado me gusta la idea.", en: "On the one hand, I like the idea."},
    {es: "Pero por otro lado, estoy en desacuerdo.", en: "But on the other hand, I disagree."},
    {es: "Nunca estás de acuerdo conmigo.", en: "You never agree with me."},
    {es: "¡Vaya casualidad!", en: "What a coincidence!"},
    {es: "Es improbable que le veas.", en: "It's unlikely that you'll see him."},
    {es: "¿Por qué tienes tanta prisa?", en: "Why are you in such a hurry?"},
    {es: "Ya lo superarás.", en: "You'll get over it."},
    {es: "Súbete al coche.", en: "Get into the car."},
    {es: "Para cuando llegues, ya se habrán ido.", en: "By the time you get there, they'll have left."},
    {es: "Es asombroso el progreso que has hecho.", en: "It's amazing the progress you've made."},
    {es: "¿Cómo lo has conseguido?", en: "How did you do it?"},
    {es: "Le quiero vivo o muerto.", en: "I want him dead or alive."},
    {es: "Quiero un estudio en profundidad.", en: "I want an in-depth study."},
    {es: "Puedes saltar este número.", en: "You can skip this number."},
    {es: "Llámame en cuanto llegue el anfitrión.", en: "Call me as soon as the host arrives."}
],
412: [
    {es: "¿Quién está encargado de esto?", en: "Who's in charge of this?"},
    {es: "¿Quién lleva la voz cantante aquí?", en: "Who calls the shots here?"},
    {es: "Más vale que hables con un abogado.", en: "You'd better talk to a lawyer."},
    {es: "Más vale que hagas algo pronto.", en: "You'd better do something soon."},
    {es: "Se van a aprovechar de ti.", en: "They're going to take advantage of you."},
    {es: "Más vale que no toques eso.", en: "You'd better not touch that."},
    {es: "Más vale que me hagas caso.", en: "You'd better pay attention to me."},
    {es: "¿Dónde estarán?", en: "I wonder where they are?"},
    {es: "Alguien está llamando a la puerta.", en: "Somebody's knocking at the door."},
    {es: "¿Quién será?", en: "I wonder who it is?"},
    {es: "No puedo permitirme el lujo de perderlo.", en: "I can't afford to lose it."},
    {es: "Discutir con él es muy frustrante.", en: "Arguing with him is very frustrating."},
    {es: "Soy escéptico acerca del éxito del plan.", en: "I'm sceptical about the plan's success."},
    {es: "Date la vuelta.", en: "Turn around."},
    {es: "¿Qué harías si eso fuera verdad?", en: "What would you do if that were true?"},
    {es: "¿Qué pasaría si no hiciéramos nada?", en: "What would happen if we did nothing?"},
    {es: "¿Qué harías tú en mi lugar?", en: "What would you do if you were me?"},
    {es: "Me pegaría un tiro.", en: "I'd shoot myself."},
    {es: "Deja de bromear, ¿quieres?", en: "Quit joking, will you?"},
    {es: "Estás tomando las cosas demasiado en serio.", en: "You're taking things too seriously."},
    {es: "¿Quieres que te caliente la sopa?", en: "Do you want me to heat up the soup for you?"},
    {es: "Tengo un hambre que no veas.", en: "I'm starving."},
    {es: "Me siento violento.", en: "I feel embarrassed."},
    {es: "Tendrás que sobornarle.", en: "You'll have to bribe him."},
    {es: "Te forrarás en ese negocio.", en: "You'll make a killing in that business."},
    {es: "¿Me puedes dar una estimación del coste?", en: "Can you give me a cost estimate?"},
    {es: "El director general fue despedido.", en: "The general manager was fired."},
    {es: "Su despido nos sorprendió a todos.", en: "His dismissal surprised all of us."},
    {es: "Fue obligado a dimitir.", en: "He was forced to resign."},
    {es: "Tuvo que firmar su propia dimisión.", en: "He had to sign his own resignation."},
    {es: "Yo no hubiera firmado.", en: "I wouldn't have signed."},
    {es: "¿Sabe el Sr. Smith quién eres?", en: "Does Mr. Smith know who you are?"},
    {es: "Nadie sabe quien soy.", en: "Nobody knows who I am."},
    {es: "¿Sabe ella cuando sale el tren?", en: "Does she know when the train leaves?"},
    {es: "¿Quién sabe dónde vive el fontanero?", en: "Who knows where the plumber lives?"},
    {es: "Esta suciedad no puede quitarse.", en: "This dirt can't be removed."},
    {es: "Se le advirtió de que no fuera allí.", en: "He was warned not to go there."},
    {es: "Perderás por mucho que te esfuerces.", en: "You'll lose no matter how hard you try."},
    {es: "No lo compraré por mucho que me llames.", en: "I won't buy it no matter how often you call me."},
    {es: "Por mucho que estudies, no aprenderás.", en: "No matter how hard you study, you won't learn."},
    {es: "Querer es poder.", en: "Where there's a will there's a way."},
    {es: "Clasifícalos por orden alfabético.", en: "Sort them in alphabetical order."},
    {es: "Lo voy a comprar, por muy caro que sea.", en: "I'm going to buy it no matter how expensive it is."},
    {es: "No lo haré a no ser que me ayudes.", en: "I won't do it unless you help me."},
    {es: "Voy a heredar una fortuna.", en: "I'm going to inherit a fortune."},
    {es: "¿Te puedes creer lo que hicieron?", en: "Can you believe what they did?"},
    {es: "Debían de haberse vuelto locos.", en: "They must have gone crazy."},
    {es: "Deberías haberles parado.", en: "You should've stopped them."},
    {es: "Tendrás que acostumbrarte a ello.", en: "You'll have to get used to it."},
    {es: "Antes me apañaba sin agenda.", en: "I used to get by without an agenda."}
],
413: [
    {es: "Tu conducta fue vergonzosa.", en: "Your conduct was disgraceful."},
    {es: "No seas cotilla.", en: "Don't be nosy."},
    {es: "No es asunto tuyo.", en: "It's none of your business."},
    {es: "Las bujías están gastadas.", en: "The spark plugs are worn out."},
    {es: "Cambiemos de sitio.", en: "Let's change places."},
    {es: "Ojalá pudiéramos cambiar de coche.", en: "I wish we could change cars."},
    {es: "Logré convencerle.", en: "I managed to convince him."},
    {es: "Ahora él está de nuestra parte.", en: "Now he's on our side."},
    {es: "No volverá a cambiar de opinión.", en: "He won't change his mind again."},
    {es: "Cambiemos de lado.", en: "Let's change sides."},
    {es: "Tendrás un periodo de prueba de 3 meses.", en: "You'll have a 3-month trial period."},
    {es: "Has hecho un trabajo digno de elogio.", en: "You've done a praiseworthy job."},
    {es: "Él no es una persona digna de confianza.", en: "He's not a trustworthy person."},
    {es: "No te puedes fiar de él.", en: "You can't trust him."},
    {es: "Te dejará en la estacada.", en: "He'll leave you high and dry."},
    {es: "Aquí todo el mundo pasa la pelota.", en: "Here everybody passes the buck."},
    {es: "¿Cómo te atreves?", en: "How dare you?"},
    {es: "Sujétalo a ambos extremos.", en: "Hold it at both ends."},
    {es: "Estíralo con todas tus fuerzas.", en: "Stretch it with all your might."},
    {es: "No se romperá, ya verás.", en: "It won't break, you'll see."},
    {es: "Llama al señor que estaba hier ayer.", en: "Call the man who was here yesterday."},
    {es: "¿Cuál era el que tu querías?", en: "Which one was the one you wanted?"},
    {es: "El que yo quería era el azul.", en: "The one I wanted was the blue one."},
    {es: "El azul... el verde... ¿qué importa?", en: "The blue one... the green one... what difference does it make?"},
    {es: "Importa mucho.", en: "It makes a big difference."},
    {es: "El azul vale cuatro veces más.", en: "The blue one's worth four times more."},
    {es: "Más vale que lo hagas, porque sino...", en: "You'd better do it, because otherwise..."},
    {es: "Haré lo que me dé la gana.", en: "I'll do what I feel like."},
    {es: "Ha sido una velada encantadora.", en: "It's been a delightful evening."},
    {es: "Nos lo hemos pasado en grande.", en: "We've had a wonderful time."},
    {es: "No lo habrían hecho si les hubieras advertido a tiempo.", en: "They wouldn't have done it if you had warned them in time."},
    {es: "Ponme al día respecto al asunto.", en: "Bring me up to date on the matter."},
    {es: "Nos adjudicaron el proyecto.", en: "They awarded us the project."},
    {es: "No cuentes conmigo.", en: "Count me out."},
    {es: "¿Podemos contar con tu colaboración?", en: "Can we count on your collaboration?"},
    {es: "Me encantaría ayudaros.", en: "I'd love to help you."},
    {es: "Se les pidió no fumar.", en: "They were asked not to smoke."},
    {es: "Se hará en un futuro próximo.", en: "It will be done in the near future."},
    {es: "Debía haberse hecho hace mucho tiempo.", en: "It should've been done a long time ago."},
    {es: "Se le dio una transfusión de sangre.", en: "He was given a blood transfusion."},
    {es: "¿Cómo salió él de la operación?", en: "How did he come out of the operation?"},
    {es: "Se recuperó en tiempo récord.", en: "He recovered in record time."},
    {es: "Si hubiéramos tenido más recursos, podríamos haber competido con ellos.", en: "If we had had more resources, we could have competed with them."},
    {es: "Esta decisión nos fortalecerá.", en: "This decision will strengthen us."},
    {es: "Si no estuviera tan apretado, yo podría respirar mejor.", en: "If it weren't so tight, I could breathe better."},
    {es: "¿Te importaría aflojarlo un poco?", en: "Would you mind loosening it a little?"},
    {es: "Las experiencias así te ensanchan la mente.", en: "Experiences like that broaden your mind."},
    {es: "La carretera no ha sido ensanchada aún.", en: "The highway hasn't been widened yet."},
    {es: "¿Cuándo caduca?", en: "When does it expire?"},
    {es: "Se te ha acabado el tiempo.", en: "Your time has run out."}
],
414: [
    {es: "Según él, deberías haberlo hecho.", en: "According to him, you should've done it."},
    {es: "Hay un viejo dicho sobre ese tema.", en: "There's an old saying about that subject."},
    {es: "En lo que a mí se refiere...", en: "As far as I'm concerned..."},
    {es: "Si fueras un poco más optimista...", en: "If you were a little more optimistic..."},
    {es: "Soy un pesimista por naturaleza.", en: "I'm a pessimist by nature."},
    {es: "Todos a favor del plan que levanten la mano.", en: "All in favour of the plan raise your hand."},
    {es: "Se fue por el desagüe.", en: "It went down the drain."},
    {es: "La fábrica se ubicará cerca de aquí.", en: "The factory will be located near here."},
    {es: "Debe de haber estado borracho para hacer semejante cosa.", en: "He must've been drunk to do such a thing."},
    {es: "Están de viaje de negocios.", en: "They're on a business trip."},
    {es: "Están de viaje de novios.", en: "They're on their honeymoon."},
    {es: "Se aproxima la fecha de tu jubilación.", en: "Your retirement date is approaching."},
    {es: "¿Qué harás cuando te jubiles?", en: "What will you do when you retire?"},
    {es: "Haré un viaje alrededor del mundo.", en: "I'll take a trip around the world."},
    {es: "¿Y después?", en: "And then?"},
    {es: "Y después, dedicaré mi tiempo a la caza.", en: "And then I'll devote my time to hunting."},
    {es: "No vendré por aquí para molestaros.", en: "I won't come around here to bother you."},
    {es: "¡Qué alivio!", en: "What a relief!"},
    {es: "Si pudieras aliviar este dolor, te lo agradecería de verdad.", en: "If you could relieve this pain, I'd really appreciate it."},
    {es: "La superficie está demasiado áspera.", en: "The surface is too rough."},
    {es: "Quiero que la hagas más lisa.", en: "I want you to make it smoother."},
    {es: "El fuerte viento derribó el árbol.", en: "The strong wind blew down the tree."},
    {es: "Derribaron el avión.", en: "They shot down the plane."},
    {es: "¿Cómo piensas sacarnos de este lío?", en: "How do you plan to get us out of this mess?"},
    {es: "No me lo explico.", en: "I can't figure it out."},
    {es: "No me explico por qué ella se fue.", en: "I can't figure out why she left."},
    {es: "Lo tengo en la punta de la lengua.", en: "I have it on the tip of my tongue."},
    {es: "No rechaces una oferta así.", en: "Don't turn down an offer like that."},
    {es: "Por cierto, ¿recibiste el recado?", en: "By the way, did you get the message?"},
    {es: "Un buen detalle ayudaría las cosas.", en: "A nice gesture would help things."},
    {es: "Él viene por aquí un día sí y otro no.", en: "He comes around here every other day."},
    {es: "Más vale tarde que nunca.", en: "Better late than never."},
    {es: "Si no hubieras tenido tanta prisa...", en: "If you hadn't been in such a hurry..."},
    {es: "¿Cómo se mide el nivel de vida?", en: "How is the standard of living measured?"},
    {es: "Se tienen en cuenta muchos factores.", en: "Many factors are taken into account."},
    {es: "Antes o después cederán.", en: "Sooner or later they'll give in."},
    {es: "No puedo deshacer este nudo.", en: "I can't untie this knot."},
    {es: "¿Por qué no sacaste el tema?", en: "Why didn't you bring up the subject?"},
    {es: "Se habría hecho si hubiera habido tiempo.", en: "It would've been done if there had been time."},
    {es: "Puesto que no hubo tiempo, no se hizo.", en: "Since there wasn't time, it wasn't done."},
    {es: "Puede que ya se haya hecho.", en: "It may have already been done."},
    {es: "¿Quién lo habrá hecho?", en: "I wonder who did it?"},
    {es: "Quienquiera que lo hizo, lo hizo bien.", en: "Whoever did it, did it well."},
    {es: "¿Por qué se habrá hecho?", en: "I wonder why it was done?"},
    {es: "Pues, se hizo y ya está.", en: "Well it was done, and that's that."},
    {es: "¿Sabes cuánto tiempo llevan aquí?", en: "Do you know how long they've been here?"},
    {es: "Si hubiera habido una tormenta, no habríamos celebrado la reunión.", en: "If there had been a storm, we wouldn't have held the meeting."},
    {es: "Fue un discurso muy convincente.", en: "It was a very convincing speech."},
    {es: "¿Me acercas la sal, por favor?", en: "Can you pass me the salt please?"},
    {es: "Esperamos con mucha ilusión tu visita.", en: "We're looking forward to your visit."}
],
415: [
    {es: "Estoy agotado. No me puedo mover.", en: "I'm exhausted. I can't move."},
    {es: "Habríamos tardado más si no nos hubieras echado una mano.", en: "It would've taken us longer if you hadn't given us a hand."},
    {es: "Se está revisando el primer borrador.", en: "The first draft is being reviewed."},
    {es: "Se modificarán algunos puntos.", en: "Some points will be revised."},
    {es: "Tiene que haber un malentendido.", en: "There has to be a misunderstanding."},
    {es: "¡Habérmelo dicho!", en: "You should've told me!"},
    {es: "Te hubieras enfadado.", en: "You would've got angry, (gotten)"},
    {es: "Habla directamente al micrófono.", en: "Speak directly into the microphone."},
    {es: "Tengo un dolor de garganta.", en: "I have a sore throat."},
    {es: "Me duele tragar.", en: "It hurts to swallow."},
    {es: "Deberías haber ido al médico antes.", en: "You should've gone to the doctor sooner."},
    {es: "Estás perdiendo peso desde hace un año.", en: "You've been losing weight for a year."},
    {es: "No mires atrás... sigue remando.", en: "Don't look back... keep rowing."},
    {es: "La moneda está enganchada en la ranura.", en: "The coin's stuck in the slot."},
    {es: "Sácala con este destornillador.", en: "Get it out with this screwdriver."},
    {es: "Si tuviera un cuchillo, podría sacarla.", en: "If I had a knife, I could get it out."},
    {es: "Estas máquinas me vuelven loco.", en: "These machines drive me crazy."},
    {es: "Ella vale su peso en oro.", en: "She's worth her weight in gold."},
    {es: "¿Crees que deberíamos hacer el esfuerzo?", en: "Do you think we should make the effort?"},
    {es: "No vale la pena.", en: "It's not worth it."},
    {es: "Valdría la pena si nos pagaran.", en: "It would be worth it if they paid us."},
    {es: "El profesor no se presentó.", en: "The teacher didn't show up. (turn up)"},
    {es: "Deben de habérsele pegado las sábanas.", en: "He must have overslept."},
    {es: "De otro modo no me lo explico.", en: "Otherwise I can't figure it out."},
    {es: "Hemos llegado a un acuerdo consensuado.", en: "We've reached a compromise agreement."},
    {es: "Tengo un compromiso ante aquella gente.", en: "I have a commitment to those people."},
    {es: "Es una vergüenza nacional.", en: "It's a national disgrace."},
    {es: "Las dos empresas se fusionaron.", en: "The two companies merged."},
    {es: "Se tardaron meses en negociar la fusión.", en: "It took months to negotiate the merger."},
    {es: "Nuestro equipo de ventas constituye un activo valioso para la empresa.", en: "Our sales team constitutes a valuable asset to the company."},
    {es: "El activo y pasivo deben ser iguales.", en: "Assets and liabilities should be equal."},
    {es: "La contabilidad es la base del balance.", en: "Accounting is the basis of the balance sheet."},
    {es: "Si este negocio fuera rentable, no tendríamos que despedir a gente.", en: "If this business were profitable, we wouldn't have to lay off people."},
    {es: "Ha habido despidos masivos en ese sector.", en: "There have been massive layoffs in that industry."},
    {es: "Lo único que me interesa es conservar mi empleo.", en: "The only thing I'm interested in is in keeping my job."},
    {es: "¿Cómo te ganas la vida?", en: "How do you make a living?"},
    {es: "¿A qué te dedicas?", en: "What do you do?"},
    {es: "¿Es así de sencillo?", en: "Is it THAT simple?"},
    {es: "Quiero pulir mi inglés.", en: "I want to brush up on my English."},
    {es: "Se te olvidó poner el acento.", en: "You forgot to put the accent."},
    {es: "Estoy ahorrando para comprar un coche.", en: "I'm saving up to buy a car."},
    {es: "¿Qué hace que un hombre haga algo así?", en: "What makes a man do something like that?"},
    {es: "Tenía que haber estado desesperado.", en: "He must've been desperate."},
    {es: "¿Para qué servirá eso?", en: "What good will THAT do?"},
    {es: "Si no fueras tan crítico con él...", en: "If you weren't so critical of him..."},
    {es: "No hay tantos como antes.", en: "There aren't as many as there used to be."},
    {es: "Cambio de marchas sin usar el embrague.", en: "I change gears without using the clutch."},
    {es: "Para concluir la sesión, quisiera pediros un favor.", en: "To wrap up the session, I'd like to ask you a favour."},
    {es: "Estas técnicas funcionan en determinadas situaciones.", en: "These techniques work in certain situations."},
    {es: "Estas técnicas no son siempre fiables.", en: "These techniques aren't always reliable."}
],
416: [
    {es: "Se me pusieron los pelos de punta.", en: "My hair stood on end."},
    {es: "Tenía un miedo horrible.", en: "I was scared to death."},
    {es: "Me puse a temblar.", en: "I started shaking."},
    {es: "El profesor me calmó.", en: "The teacher calmed me down."},
    {es: "El miedo es una sensación aterradora.", en: "Fear is a terrifying sensation."},
    {es: "Se me fue el santo al cielo.", en: "It completely slipped my mind."},
    {es: "Deja de tocarte la nariz, ¿quieres?", en: "Stop picking your nose, will you?"},
    {es: "Está tan lejos que apenas lo puedo divisar.", en: "It's so far away that I can hardly make it out."},
    {es: "Casi nunca se debería hacer.", en: "It should hardly ever be done."},
    {es: "Ese tipo es un pesado de narices.", en: "That guy is a pain in the neck."},
    {es: "¡Qué fastidio levantarse por la mañana!", en: "What a drag it is getting up!"},
    {es: "Ella tiene un don para los idiomas.", en: "She has a gift for languages."},
    {es: "Es una niña superdotada.", en: "She's a gifted child."},
    {es: "Tiene un coeficiente de inteligencia muy alto.", en: "She has a very high I.Q."},
    {es: "Me estoy liando con tantos datos.", en: "I'm getting mixed up with so much data."},
    {es: "Me estás liando.", en: "You're getting me mixed up."},
    {es: "¿Qué tiene que ver esto con aquello?", en: "What does this have to do with that?"},
    {es: "Te codeas con gente importante.", en: "You rub shoulders with important people."},
    {es: "Por mucho que trabajes no vas a ganar más dinero.", en: "No matter how hard you work, you're not going to earn more money."},
    {es: "Por muy inteligente que seas...", en: "No matter how intelligent you are..."},
    {es: "Por muchas veces que vayas...", en: "No matter how often you go..."},
    {es: "Por muy rápido que conduzcas...", en: "No matter how fast you drive..."},
    {es: "Por mucho que le presiones...", en: "No matter how hard you pressure him..."},
    {es: "Por muchas vitaminas que tomes...", en: "No matter how many vitamins you take..."},
    {es: "Cancélalo.", en: "Call it off."},
    {es: "¿Por qué aguantas ese comportamiento?", en: "Why do you put up with that behaviour?"},
    {es: "Dile que se ocupe de sus propios asuntos.", en: "Tell him to mind his own business."},
    {es: "No es asunto suyo.", en: "It's none of his business."},
    {es: "Está fisgoneando en tu vida privada.", en: "He's prying into your private life."},
    {es: "Aléjate del vapor.", en: "Get away from the steam."},
    {es: "Voy a apretarles las tuercas.", en: "I'm going to tighten the screws on them."},
    {es: "Voy a hacerles sudar un poco.", en: "I'm going to make them sweat a little."},
    {es: "No te asomes por la ventana.", en: "Don't lean out the window."},
    {es: "No te apoyes en la pared.", en: "Don't lean against the wall."},
    {es: "Estamos respirando el humo de ese tubo de escape.", en: "We're breathing the fumes from that exhaust pipe."},
    {es: "Lávate los dientes y acuéstate.", en: "Brush your teeth and go to bed."},
    {es: "No puedo evitar reírme delante de él.", en: "I can't help laughing in front of him."},
    {es: "Tiene una nariz tan grande.", en: "He has such a big nose."},
    {es: "Hay algo en él que atrae a las mujeres.", en: "There's something about him that attracts women."},

    {es: "Tienes que reconocer que no es guapo.", en: "You have to admit he's not handsome."},

    {es: "Su voz me da escalofríos.", en: "His voice gives me the shivers."},
    {es: "Me casaría con él si me lo pidiera.", en: "I'd marry him if he asked me."},
    {es: "Está demasiado ocupado haciéndose rico.", en: "He's too busy getting rich."},
    {es: "Tiene un don que pocos hombres poseen.", en: "He has a gift that few men possess."},
    {es: "Se siente su presencia cuando entra por la puerta.", en: "His presence is felt when he comes in through the door."},
    {es: "Casi me desmayo cada vez que me mira.", en: "I almost faint whenever he looks at me."},
    {es: "Es una lástima que está casado.", en: "It's too bad he's married."}
