/* =====================================================
   LOGIN
===================================================== */

function enviarEnlaceAcceso() {

    const email =
        document
        .getElementById("emailInput")
        .value
        .trim();

    const mensaje =
        document.getElementById("loginMessage");


    if (
        !email ||
        !email.includes("@")
    ) {

        mensaje.textContent =
            "Introduce un correo válido.";

        return;
    }


    const actionCodeSettings = {

        url:
        "https://juandagarre.github.io/Libros_1-4/",

        handleCodeInApp: true

    };


    mensaje.textContent =
        "Enviando enlace...";


    auth.sendSignInLinkToEmail(
        email,
        actionCodeSettings
    )
    .then(function() {

        /*
           Guardamos el correo para poder completar
           el acceso cuando el usuario pulse el enlace.
        */

        window.localStorage.setItem(
            "emailForSignIn",
            email
        );


        mensaje.textContent =
            "Enlace enviado. Revisa tu correo.";

    })
    .catch(function(error) {

        console.error(error);

        mensaje.textContent =
            "No se pudo enviar el enlace: " +
            error.message;

    });

}

function generarLibros() {

    const contenedor =
        document.getElementById(
            "bookButtons"

    contenedor.innerHTML = "";


    for (
        let i = 1;
        i <= 4;
        i++
    ) {

        boton.textContent =
            "Libro " + i;


        boton.onclick =

        contenedor.appendChild(

/* =====================================================

function seleccionarLibro(
    numeroLibro
) {

    const contenedor =
        document.getElementById(
            "listButtons"
        );

    contenedor.innerHTML = "";


    const inicio =
        101 +
        (numeroLibro - 1) * 30;


    for (
        let i = 0;
        i < 30;
        i++
    ) {

        const numero =
            inicio + i;


        const boton =
            document.createElement("button");


        boton.textContent =
            numero;


        boton.onclick =
            function() {

                cargarLista(numero);

            };


        contenedor.appendChild(
            boton
        );

    }

}


/* =====================================================
   CARGAR LISTA
===================================================== */

function cargarLista(numero) {

    detenerAudio();


    /*
       IMPORTANTE:
       Ya no utilizamos la lista 101 como
       sustituta silenciosa si falta una lista.
    */

    if (
        !Array.isArray(
            baseDatosListas[numero]
        )
    ) {

        alert(
            "La lista " +
            numero +
            " todavía no está incluida."
        );

        return;
    }


    numeroListaActual =
        numero;


    listaActual =
        baseDatosListas[numero];


    indiceFrase = 0;


    document
        .getElementById("menuView")
        .classList
        .add("hidden");


    document
        .getElementById("studyView")

        .remove("hidden");


    document
        .getElementById("sequenceView")

        .add("hidden");


    document
        .getElementById("studyTitle")

}

/* =====================================================
   HABLAR
===================================================== */

function hablar(
    texto,
    idioma,
    velocidad
) {

    const utterance =
        new SpeechSynthesisUtterance(
            texto
        );


    utterance.lang =
        idioma;


    utterance.rate =
        velocidad;


    utterance.pitch = 1;


    const voces =
        synth.getVoices();


    const voz =
        voces.find(
            function(v) {

                return (
                    v.lang === idioma
                );

            }
        );


    if (voz) {

        utterance.voice =
            voz;

    }


    synth.speak(
        utterance
    );

}

   AUDIO DE UNA FRASE
===================================================== */

    detenerAudio();


    hablar(
        listaActual[indiceFrase].en,

}


function escucharEspanol() {

        "es-ES",

}


/* =====================================================
   NAVEGACIÓN CIRCULAR
===================================================== */

function siguienteFrase() {

    if (
        !listaActual.length
    ) {

        return;
    }


    detenerAudio();


    indiceFrase =
        (
            indiceFrase + 1
        ) %
        listaActual.length;


    actualizarFrase();

}


function anteriorFrase() {

    if (
        !listaActual.length
    ) {

        return;
    }


    detenerAudio();


    indiceFrase =
        (
            indiceFrase -
            1 +
            listaActual.length
        ) %
        listaActual.length;


    actualizarFrase();

}

/* =====================================================
   CARGAR VOCES
===================================================== */

function cargarVoces() {

    const voces =
        synth.getVoices();


    const english =
        document.getElementById(
            "englishVoice"
        );


    const spanish =
        document.getElementById(
            "spanishVoice"
        );


    const valorAnteriorEN =
        english.value;


    const valorAnteriorES =
        spanish.value;


    english.innerHTML = "";
    spanish.innerHTML = "";


    voces
        .filter(function(v) {

            return v.lang
                .toLowerCase()
                .startsWith("en");

        })
        .forEach(function(v) {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                v.lang;


            option.textContent =
                v.name +
                " (" +
                v.lang +
                ")";


            english.appendChild(
                option
            );

        });


    voces
        .filter(function(v) {

            return v.lang
                .toLowerCase()
                .startsWith("es");

        })
        .forEach(function(v) {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                v.lang;


            option.textContent =
                v.name +
                " (" +
                v.lang +
                ")";


            spanish.appendChild(
                option
            );

        });


    if (
        valorAnteriorEN &&
        [...english.options]
            .some(
                o =>
                o.value ===
                valorAnteriorEN
            )
    ) {

        english.value =
            valorAnteriorEN;

    }
    else if (
        [...english.options]
            .some(
                o =>
                o.value ===
                "en-US"
            )
    ) {

        english.value =
            "en-US";

    }


    if (
        valorAnteriorES &&
        [...spanish.options]
            .some(
                o =>
                o.value ===
                valorAnteriorES
            )
    ) {

        spanish.value =
            valorAnteriorES;

    }
    else if (
        [...spanish.options]
            .some(
                o =>
                o.value ===
                "es-ES"
            )
    ) {

        spanish.value =
            "es-ES";

    }

}


if (
    "speechSynthesis" in window
) {

    synth.onvoiceschanged =
        cargarVoces;


    setTimeout(
        cargarVoces,
        500
    );

}


/* =====================================================
   CONTROL AUDIO
===================================================== */

function detenerAudio() {

    synth.cancel();

    secuenciaDetenida =
        true;

}


function pausarAudio() {

    if (
        synth.speaking
    ) {

        synth.pause();

    }

}


function reanudarAudio() {

    if (
        synth.paused
    ) {

        synth.resume();

    }

}


/* =====================================================
   REPRODUCCIÓN SECUENCIAL
===================================================== */

function reproducirSecuencia(
    modo
) {

    if (
        !listaActual.length
    ) {

        return;
    }


    detenerAudio();


    modoSecuenciaActivo =
        modo;


    indiceSecuencia = 0;


    secuenciaDetenida =
        false;


    reproducirSiguiente();

}


/* =====================================================
   OBTENER PASOS
===================================================== */

function obtenerPasos(
    modo,
    frase
) {

    const vozEN =
        document
        .getElementById(
            "englishVoice"
        )
        .value;


    const vozES =
        document
        .getElementById(
            "spanishVoice"
        )
        .value;


    if (
        modo === "en"
    ) {

        return [
            {
                texto: frase.en,
                idioma: vozEN
            }
        ];

    }


    if (
        modo === "es"
    ) {

        return [
            {
                texto: frase.es,
                idioma: vozES
            }
        ];

    }


    if (
        modo === "en-es"
    ) {

        return [

            {
                texto: frase.en,
                idioma: vozEN
            },

            {
                texto: frase.es,
                idioma: vozES
            }

        ];

    }


    return [

        {
            texto: frase.es,
            idioma: vozES
        },

        {
            texto: frase.en,
            idioma: vozEN
        }

    ];

}


/* =====================================================
   SIGUIENTE ELEMENTO DE LA SECUENCIA
===================================================== */

function reproducirSiguiente() {

    if (
        secuenciaDetenida
    ) {

        return;
    }


    if (
        indiceSecuencia >=
        listaActual.length
    ) {

        return;
    }


    const frase =
        listaActual[
            indiceSecuencia
        ];


    const pasos =
        obtenerPasos(
            modoSecuenciaActivo,
            frase
        );


    let paso =
        0;


    const velocidad =
        parseFloat(
            document
            .getElementById(
                "speedSelect"
            )
            .value
        );


    if (
        modoSecuenciaActivo ===
        "es" ||
        modoSecuenciaActivo ===
        "es-en"
    ) {

        document
            .getElementById(
                "visualizacion"
            )
            .textContent =
            frase.es;

    }
    else {

        document
            .getElementById(
                "visualizacion"
            )
            .textContent =
            frase.en;

    }


    function siguientePaso() {

        if (
            secuenciaDetenida
        ) {

            return;
        }


        if (
            paso >=
            pasos.length
        ) {

            indiceSecuencia++;

            reproducirSiguiente();

            return;

        }


        const item =
            pasos[paso++];


        const utterance =
            new SpeechSynthesisUtterance(
                item.texto
            );


        utterance.lang =
            item.idioma;


        utterance.rate =
            velocidad;


        utterance.pitch = 1;


        const voz =
            synth
            .getVoices()
            .find(
                function(v) {

                    return (
                        v.lang ===
                        item.idioma
                    );

                }
            );


        if (voz) {

            utterance.voice =
                voz;

        }


        utterance.onend =
            siguientePaso;


        utterance.onerror =
            function() {

                if (
                    !secuenciaDetenida
                ) {

                    siguientePaso();

                }

            };


        synth.speak(
            utterance
        );

    }


    siguientePaso();

}


/* =====================================================
   VISUALIZACIÓN
===================================================== */

function mostrarSecuenciaEN() {

    mostrarSecuencia(
        "en"
    );

}


function mostrarSecuenciaES() {

    mostrarSecuencia(
        "es"
    );

}


function mostrarSecuenciaENES() {

    mostrarSecuencia(
        "en-es"
    );

}


function mostrarSecuenciaESEN() {

    mostrarSecuencia(
        "es-en"
    );

}


function mostrarSecuencia(
    modo
) {

    let texto = "";


    listaActual.forEach(
        function(frase, i) {

            if (
                modo === "en"
            ) {

                texto +=
                    (i + 1) +
                    ". " +
                    frase.en +
                    "<br><br>";

            }


            if (
                modo === "es"
            ) {

                texto +=
                    (i + 1) +
                    ". " +
                    frase.es +
                    "<br><br>";

            }


            if (
                modo === "en-es"
            ) {

                texto +=
                    (i + 1) +
                    ". " +
                    frase.en +
                    "<br>" +
                    frase.es +
                    "<br><br>";

            }


            if (
                modo === "es-en"
            ) {

                texto +=
                    (i + 1) +
                    ". " +
                    frase.es +
                    "<br>" +
                    frase.en +
                    "<br><br>";

            }

        }
    );


    document
        .getElementById(
            "visualizacion"
        )
        .innerHTML =
        texto;

}


/* =====================================================
   ARRANQUE
===================================================== */

generarLibros();
