    // --- CONFIGURACIÓN DE FIREBASE ---
    const firebaseConfig = {
        apiKey: "AIzaSyC_s5suiACPV_itJAq4XcR3tEXOPoGfT6M",
        authDomain: "libros-1-4.firebaseapp.com",
        projectId: "libros-1-4"
    };
    firebase.initializeApp(firebaseConfig);

    // --- CONFIGURACIÓN DE EMAILJS ---
    (function(){
        emailjs.init("UgKsBw8SRMgYBoPy3KWgx");
    })();

    const actionCodeSettings = {
        url: 'https://juandagarre.github.io/Libros_1-4/', // URL exacta de tu GitHub Pages
        handleCodeInApp: true,
    };



    
    

    function enviarEnlaceLogin() {
        const email = document.getElementById('email-usuario').value;
        const mensaje = document.getElementById('mensaje-login');

        if (!email) {
            mensaje.style.color = "red";
            mensaje.innerText = "Por favor, introduce un correo válido.";
            return;
        }

        firebase.auth().sendSignInLinkToEmail(email, actionCodeSettings)
            .then(() => {
                window.localStorage.setItem('emailForSignIn', email);
                mensaje.style.color = "#27ae60";
                mensaje.innerText = "¡Enlace enviado! Revisa tu bandeja de entrada.";
            })
            .catch((error) => {
                mensaje.style.color = "red";
                mensaje.innerText = "Error: " + error.message;
            });
    }

        // Comprobar si el usuario vuelve mediante el enlace del correo
    if (firebase.auth().isSignInWithEmailLink(window.location.href)) {
        let email = window.localStorage.getItem('emailForSignIn');
        if (!email) {
            email = window.prompt('Por favor, confirma tu correo electrónico para finalizar el acceso:');
        }
        
        if (email) {
            firebase.auth().signInWithEmailLink(email, window.location.href)
                .then((result) => {
                    window.localStorage.removeItem('emailForSignIn');
                    
                    // Limpiar la URL para quitar los códigos largos de Firebase
                    window.history.replaceState({}, document.title, window.location.pathname);

                    // Enviar notificación por EmailJS
                    emailjs.send("service_ft1wkhu", "template_4acbswy", {
                        usuario_email: email,
                        fecha_ingreso: new Date().toLocaleString()
                    }).catch(err => console.log("Error EmailJS:", err));

                    iniciarAplicacion();
                })
                .catch((error) => {
                    alert("Error al verificar el enlace: " + error.message);
                });
        }
    }

    

    function iniciarAplicacion() {
        document.getElementById('vista-login').classList.add('oculto');
        document.getElementById('vista-menu').classList.remove('oculto');
        seleccionarLibro(1);
    }
</script>

127: [

306: [

308: [

    {es: "No te disgustes.", en: "Don't get upset."},
    {es: "Habrá otra guerra si no hacemos algo.", en: "There'll be another war if we don't do something."},
    {es: "El mundo nunca ha tenido un siglo de paz.", en: "The world has never had a century of peace."},
    {es: "Este soldado lleva dos días muerto.", en: "This soldier has been dead for two days."},
    {es: "Debe de haber muerto antes de ayer.", en: "He must have died the day before yesterday."},
    {es: "¿Cómo sabes que está muerto?", en: "How do you know he's dead?"},
    {es: "No está respirando.", en: "He isn't breathing."},
    {es: "Ha muerto por una explosión.", en: "He was killed by an explosion."},
    {es: "Debió de ser una explosión fuerte.", en: "It must have been a strong explosion."},
    {es: "Tengo que dar de comer a mucha gente.", en: "I have to feed a lot of people."},
    {es: "Mantengo a mi familia.", en: "I support my family."},
    {es: "¡Ojo!", en: "Look out!"},
    {es: "No te preocupes, tendré cuidado.", en: "Don't worry, I'll be careful."},
    {es: "No lo hagas si no quieres.", en: "Don't do it if you don't want to."},
    {es: "Vengo aquí porque me gusta.", en: "I come here because I like to."},
    {es: "Nadie te ha pedido que vengas.", en: "Nobody's asked you to come."},
    {es: "Tomaré mis propias decisiones.", en: "I'll make my own decisions."},
    {es: "Debería haber más escritorios.", en: "There should be more desks."},
    {es: "¿Quién se llevó las cajas?", en: "Who took the boxes?"},
    {es: "¿De qué cajas estás hablando?", en: "What boxes are you talking about?"},
    {es: "De las que estaban aquí esta mañana.", en: "About the ones that were here this morning."},
    {es: "Están siendo pintadas.", en: "They're being painted."},
    {es: "¿Quién dio la orden de que fuesen pintadas?", en: "Who gave the order to paint them?"},
    {es: "Yo, señor.", en: "I did, sir."},
    {es: "Haz que se traigan aquí otra vez.", en: "Have them brought back here."},
    {es: "Pero están en malas condiciones.", en: "But they're in bad condition."},
    {es: "¡No me importa cómo estén!", en: "I don't care how they are!"},
    {es: "Pero ya se han pintado.", en: "But they've already been painted."},
    {es: "Que se traigan aquí de todas formas.", en: "Have them brought here anyway."}
],
316: [
    {es: "Estoy aquí desde esta mañana.", en: "I've been here since this morning."},
    {es: "Se enfadará si se lo dices.", en: "He'll get angry if you tell him."},
    {es: "No tengo intención de decírselo.", en: "I don't intend to tell him."},
    {es: "Pero tarde o temprano se enterará.", en: "But he'll find out sooner or later."},
    {es: "No estaré aquí cuando se entere.", en: "I won't be here when he finds out."},
    {es: "Puede que todavía haya una solución.", en: "There still may be a solution."},
    {es: "¿Qué es?", en: "What is it?"},
    {es: "Podríamos atracar un banco.", en: "We could rob a bank."},
    {es: "Eso sería demasiado peligroso.", en: "That would be too dangerous."},
    {es: "Además, alguien podría hacerse daño.", en: "Besides, someone could get hurt."},
    {es: "Entonces, ¿qué sugieres que hagamos?", en: "Then what do you suggest we do?"},
    {es: "Sugiero que pidamos prestado el dinero.", en: "I suggest we borrow the money."},
    {es: "¿Cómo vas a conseguir tanto dinero?", en: "How are you going to get so much money?"},
    {es: "Tiene que haber una manera.", en: "There has to be a way."},
    {es: "Alguien ha estado aquí.", en: "Someone's been here."},
    {es: "Lleva tres días lloviendo.", en: "It's been raining for three days."},
    {es: "¿Por qué no han hecho nada todavía?", en: "Why haven't they done anything yet?"},
    {es: "No se les dijo que hicieran nada.", en: "They weren't told to do anything."},
    {es: "La guerra se ha terminado.", en: "The war's over."},
    {es: "Estoy cansado de esperarle.", en: "I'm tired of waiting for him."},
    {es: "¿Cuánto suele tardar en venir?", en: "How long does it usually take him to come?"},
    {es: "Suele tardar aproximadamente una hora.", en: "It usually takes him about an hour."},
    {es: "¿Dónde estará?", en: "I wonder where he is."},
    {es: "Algo debe de haberle pasado.", en: "Something must have happened to him."},
    {es: "Es extraño que no haya llegado.", en: "It's strange that he hasn't arrived."},
    {es: "A lo mejor ha tenido un accidente.", en: "Maybe he's had an accident."},
    {es: "¿Cuánto tiempo vas a esperar?", en: "How long are you going to wait?"},
    {es: "Unos minutos más.", en: "A few minutes more."},
    {es: "Y después, ¿qué harás?", en: "And then what will you do?"},
    {es: "No tengo ni idea.", en: "I have no idea."},
    {es: "Ha habido unos cambios recientemente.", en: "There have been some changes recently."},
    {es: "¿De qué clase de cambios estás hablando?", en: "What kind of changes are you talking about?"},
    {es: "Te van a trasladar a mi departamento.", en: "They're going to transfer you to my department."},
    {es: "¿Quieres decir que vamos a trabajar juntos?", en: "Do you mean we're going to work together?"},
    {es: "Así es.", en: "That's right."},
    {es: "Ya era hora.", en: "It's about time."},
    {es: "¿Dónde conseguiste esa información?", en: "Where did you get that information?"},
    {es: "Lo sé desde hace mucho tiempo.", en: "I've known it for a long time."},
    {es: "¿Por qué no me dijiste nada?", en: "Why didn't you tell me anything?"},
    {es: "Prometí mantenerlo en secreto.", en: "I promised to keep it a secret."},
    {es: "Pero podías habérmelo dicho a mí.", en: "But you could have told me."},
    {es: "Pero la decisión no era definitiva.", en: "But the decision wasn't final."},
    {es: "¿Lo es ahora?", en: "Is it now?"},
    {es: "Todo el mundo será informado mañana.", en: "Everyone will be informed tomorrow."},
    {es: "¿Significará una subida salarial?", en: "Will it mean a raise / rise?"},
    {es: "Por supuesto que sí.", en: "Of course it will."},
    {es: "¿Cuánto tiempo llevas planeando esto?", en: "How long have you been planning this?"},
    {es: "Ha sido idea mía desde hace mucho tiempo.", en: "It's been an idea of mine for a long time."},
    {es: "¿De quién dependeré?", en: "Who will I report to?"},
    {es: "Serás mi brazo derecho.", en: "You'll be my right-hand man."}
],
317: [
    {es: "Estoy decepcionado con tu progreso.", en: "I'm disappointed with your progress."},
    {es: "Eres capaz de hacer mayores progresos.", en: "You're capable of making greater progress."},
    {es: "No has hecho un gran esfuerzo.", en: "You haven't made a big effort."},
    {es: "Has desperdiciado mucho tiempo.", en: "You've wasted a lot of time."},
    {es: "Tu madre está muy disgustada.", en: "Your mother is very upset."},
    {es: "Deberías haber estudiado mucho más.", en: "You should've studied much more."},
    {es: "Deberías haber asistido a más clases.", en: "You should've attended more classes."},
    {es: "Tengo razones para estar enfadado.", en: "I have reasons to be angry."},
    {es: "¿Ahora qué voy a hacer contigo?", en: "Now what am I going to do with you?"},
    {es: "¿Qué va a pensar tu abuela cuando se entere?", en: "What is your grandmother going to think when she finds out?"},
    {es: "Casi tengo miedo de decírselo.", en: "I'm almost afraid to tell her."},
    {es: "¿Sabes cuánto ha costado este curso?", en: "Do you know how much this course has cost?"},
    {es: "He tenido que hacer sacrificios.", en: "I've had to make sacrifices."},
    {es: "La vida no es un lecho de rosas.", en: "Life is not a bed of roses."},
    {es: "Tienes que luchar por todo lo que consigues.", en: "You have to fight for everything you get."},
    {es: "Nunca llegarás a ninguna parte con esa actitud.", en: "You'll never get anywhere with that attitude."},
    {es: "No entiendo a los jóvenes de hoy día.", en: "I don't understand young people nowadays."},
    {es: "Cuando yo tenía tu edad, estábamos orgullosos de ir a la universidad.", en: "When I was your age, we were proud to go to the university."},
    {es: "¿Qué os pasa?", en: "What's the matter with you?"},
    {es: "¿Qué vas a hacer ahora?", en: "What are you going to do now?"},
    {es: "¿Crees que voy a mantenerte para siempre?", en: "Do you thing I'm going to support you forever?"},
    {es: "Más vale que busques un trabajo.", en: "You'd better look for a job."},
    {es: "Ya te hemos dado dos oportunidades.", en: "We've already given you two chances."},
    {es: "No las has aprovechado.", en: "You haven't taken advantage of them."},
    {es: "Deberías estar avergonzado.", en: "You should be ashamed."},
    {es: "¿Qué voy a decir a mis amigos?", en: "What am I going to tell my friends?"},
    {es: "Creerán que tengo un hijo tonto.", en: "They'll think I have a stupid son."},
    {es: "¿Quieres que piensen eso?", en: "Do you want them to think that?"},
    {es: "Antes eras un buen estudiante.", en: "You used to be a good student."},
    {es: "Antes conseguías buenas notas.", en: "You used to get good grades."},
    {es: "Ya no haces ningún esfuerzo.", en: "You don't make an effort anymore."},
    {es: "¿Qué hemos hecho para merecer esto?", en: "What have we done to deserve this?"},
    {es: "Yo tenía grandes planes para ti.", en: "I had big plans for you."},
    {es: "Te iba a conseguir un buen empleo.", en: "I was going to get you a good job."},
    {es: "Te iba a asegurar tu futuro.", en: "I was going to assure your future."},
    {es: "¿Qué va a pensar el Sr. Smith?", en: "What is Mr. Smith going to think?"},
    {es: "¿Cómo se lo voy a decir?", en: "How am I going to tell him?"},
    {es: "¿Sabe su hija acerca de esto?", en: "Does his daughter know about this?"},
    {es: "No querrá casarse con un don nadie.", en: "She won't want to marry a nobody."},
    {es: "¿Le has dicho algo a ella?", en: "Have you told her anything?"},
    {es: "¿Qué dijo?", en: "What did she say?"},
    {es: "Estáis los dos locos.", en: "You're both crazy."},
    {es: "¿Cómo piensas mantenerla?", en: "How are you planning to support her?"},
    {es: "El dinero no crece en los árboles.", en: "Money doesn't grow on trees."},
    {es: "Algún día te arrepentirás de esto.", en: "Someday you'll regret this."},
    {es: "¿No tienes nada que decir?", en: "Don't you have anything to say?"},
    {es: "Di algo.", en: "Say something."},
    {es: "Haz con tu vida lo que quieras.", en: "Do with your life what you want."},
    {es: "No quiero saber nada.", en: "I don't want to know anything."},
    {es: "En lo que a mí respecta, ya no tengo hijo.", en: "As far as I'm concerned, I don't have a son anymore."}
],
318: [
    {es: "No hemos llegado a una conclusión aún.", en: "We haven't reached a conclusion yet."},
    {es: "Se han limpiado las casas.", en: "The houses have been cleaned."},
    {es: "Se han destruido los barcos.", en: "The ships have been destroyed."},
    {es: "No se ha corregido el error.", en: "The mistake hasn't been corrected."},
    {es: "Tus posibilidades son muy remotas.", en: "Your chances are very slim / remote."},
    {es: "Los números han sido cambiados.", en: "The numbers have been changed."},
    {es: "¿Es esto todo lo que has hecho?", en: "Is this all you've done?"},
    {es: "Acabo de empezar.", en: "I've just started."},
    {es: "¿No puedes trabajar un poco más rápido?", en: "Can't you work a little faster?"},
    {es: "¿Quieres calidad o cantidad?", en: "Do you want quality or quantity?"},
    {es: "Acabamos de recibir la noticia.", en: "We've just received the news."},
    {es: "Yo acababa de comer cuando él llegó.", en: "I had just eaten when he arrived."},
    {es: "¿Has rellenado el impreso?", en: "Have you filled out the form?"},
    {es: "¿De qué impreso estás hablando?", en: "What form are you talking about?"},
    {es: "Del que está delante de ti.", en: "About the one that's in front of you."},

    {es: "¿Qué estoy solicitando?", en: "What am I applying for?"},
    {es: "Quiero que solicites un trabajo.", en: "I want you to apply for a job."},
    {es: "¿Para qué?", en: "What for?"},
    {es: "Para que puedas mantener a tu mujer.", en: "So that you can support your wife."},
    {es: "¿Para qué necesito mantenerla?", en: "What do I need to support her for?"},
    {es: "Para que ella pueda tener un hogar.", en: "So that she can have a home."},
    {es: "¿Para qué necesita un hogar?", en: "What does she need a home for?"},
    {es: "Para que te pueda servir tus comidas.", en: "So that she can serve you your meals."},
    {es: "Eso me parece una buena idea.", en: "That sounds like a good idea."},
    {es: "Por supuesto que sí.", en: "Of course it does."},
    {es: "Nunca se me había ocurrido.", en: "It had never occurred to me."},
    {es: "Eres un poco extraño, ¿sabes?", en: "You're a little strange, you know?"},
    {es: "Tú también.", en: "So are you."},
    {es: "¿Me puedes dar fuego?", en: "Can you give me a light?"},
    {es: "No deberías fumar tanto.", en: "You shouldn't smoke so much."},
    {es: "No lo puedo evitar.", en: "I can't help it."},
    {es: "Te cansas cuando subes escaleras.", en: "You get tired when you climb stairs."},
    {es: "Tú también.", en: "So do you."},

    {es: "Yo tampoco.", en: "Neither do I."},
    {es: "Silencio, están dormidos.", en: "Be quiet, they're asleep / sleeping."},
    {es: "No les despiertes.", en: "Don't wake them up."},

319: [
    {es: "El ciego me llevó al quiosco.", en: "The blind man took me to the news-stand."},
    {es: "Le pregunté si quería que le comprara una revista.", en: "I asked him if he wanted me to buy him a magazine."},
    {es: "Él me recordó que era ciego.", en: "He reminded me that he was blind."},
    {es: "Deja de molestarme.", en: "Stop bothering me."},
    {es: "No entendía ni una palabra.", en: "I didn't understand a single word."},
    {es: "Hablaba como si tuviera canicas en la boca.", en: "He talked as if he had marbles in his mouth."},
    {es: "Le pedí que hablara más despacio.", en: "I asked him to speak more slowly."},
    {es: "No me hizo caso.", en: "He ignored me."},
    {es: "Me fui de la reunión.", en: "I left the meeting."},
    {es: "Eres un caso perdido.", en: "You're a lost case."},
    {es: "Tendremos que demostrárselo.", en: "We'll have to prove it to them."},
    {es: "¿Tienes una coartada?", en: "Do you have an alibi?"},
    {es: "Dirijo un servicio de formación.", en: "I run a training service."},
    {es: "¿Quién es el responsable?", en: "Who's in charge?"},
    {es: "Fue una extraña casualidad.", en: "It was a strange coincidence."},
    {es: "Puedes contar conmigo.", en: "You can count on me."},
    {es: "Fue una velada encantadora.", en: "It was a delightful evening."},
    {es: "La historia tuvo un final feliz.", en: "The story had a happy ending."},
    {es: "¿Mataron al malo?", en: "Did they kill the bad guy?"},
    {es: "Él pasó el resto de su vida en la cárcel.", en: "He spent the rest of his life in prison."},
    {es: "La moral ha sido gravemente dañada.", en: "The morale has been seriously damaged."},
    {es: "¿Cuáles son las características de una buen gerente?", en: "What are the traits of a good manager?"},
    {es: "Yo qué sé.", en: "What do I know."},
    {es: "Hay un rumor de que te vas.", en: "There's a rumour that you're leaving."},
    {es: "¿Quién te ha contado eso?", en: "Who told you that?"},
    {es: "Lo oí por radio macuto.", en: "I heard it through the grapevine."},
    {es: "Esta compañía apesta.", en: "This company stinks."},
    {es: "Tan mala no es.", en: "It's not that bad."},
    {es: "Necesito más cancha para trabajar.", en: "I need more room to work."},
    {es: "¿Cómo puedes decir eso?", en: "How can you say that?"},
    {es: "No puedo influir en la política de la compañía.", en: "I can't influence company policy."},
    {es: "Pero sólo llevas un año aquí.", en: "But you've only been here for a year."},
    {es: "Además, sólo tienes 28 años.", en: "Besides, you're only 28 years old."},
    {es: "¿Y qué?", en: "So what?"},
    {es: "Tienes que ser paciente.", en: "You have to be patient."},
    {es: "La paciencia es una virtud.", en: "Patience is a virtue."},
    {es: "Se me ha agotado la paciencia.", en: "I've run out of patience."},
    {es: "¿Qué piensas hacer?", en: "What are you planning to do?"},
    {es: "Voy a dimitir.", en: "I'm going to resign."},
    {es: "No aceptarán tu dimisión.", en: "They won't accept your resignation."},
    {es: "No me importa.", en: "I don't care."},
    {es: "¿Qué planes tienes?", en: "What plans do you have?"},
    {es: "Voy a entrar en política.", en: "I'm going to enter politics."},
    {es: "Estás buscando problemas.", en: "You're looking for trouble."},
    {es: "Me apañaré.", en: "I'll get by."},
    {es: "¿Te gusta la política?", en: "Do you like politics?"},
    {es: "Es la mejor forma de cambiar las cosas.", en: "It's the best way to change things."},
    {es: "Cambiar las cosas no es tan fácil.", en: "Changing things is not that easy."},
    {es: "Tengo una misión en la vida.", en: "I have a mission in life."},

],
320: [
    {es: "No abandones.", en: "Don't give up."},
    {es: "No des tu brazo a torcer.", en: "Don't give in."},
    {es: "Asegúrate de que la gente te oiga.", en: "Make sure the people hear you."},

    {es: "No pierdas la calma.", en: "Don't lose your cool."},
    {es: "Trata de causar una buena impresión.", en: "Try to give a good impression."},
    {es: "No dejes que te pongan nervioso.", en: "Don't let them make you nervous."},
    {es: "Empieza el discurso con una anécdota.", en: "Start the speech with an anecdote."},

    {es: "Seguiré tus consejos.", en: "I'll follow your advice."},
    {es: "Deséame suerte.", en: "Wish me luck."},
    {es: "No te defraudaré.", en: "I won't disappoint you."},
    {es: "Espero que no.", en: "I hope not."},

    {es: "¿Nunca lo has probado?", en: "Haven't you ever tried it?"},
    {es: "Ha habido varias quejas.", en: "There have been several complaints."},

    {es: "Pues que coman tarta.", en: "Then let them eat cake."},

326: [

328: [

329: [

330: [
    {es: "Han llegado a una conclusión final.", en: "They've reached a final conclusion."},
    {es: "Han decidido vender el negocio.", en: "They've decided to sell the business."},
    {es: "Tienen que pagar a sus acreedores.", en: "They have to pay their creditors."},
    {es: "Tienen muchas deudas.", en: "They have a lot of debts."},
    {es: "Deben millones a los bancos.", en: "They owe millions to the banks."},
    {es: "Nadie les dará un préstamo ahora.", en: "No one will give them a loan now."},
    {es: "Es muy arriesgado invertir ahora.", en: "It's very risky to invest now."},
    {es: "La mano de obra es cara.", en: "Manpower is expensive."},
    {es: "Los bancos se niegan a prestar dinero.", en: "Banks refuse to lend money."},
    {es: "Nadie quiere ahorrar.", en: "Nobody wants to save."},
    {es: "El paro está subiendo.", en: "Unemployment is increasing."},
    {es: "El gasto público es demasiado alto.", en: "Public spending is too high."},
    {es: "No me hables de economía.", en: "Don't talk to me about economics."},

    {es: "Habrá más libros.", en: "There will be more books."},
    {es: "¿Qué contendrán?", en: "What will they contain?"},

    {es: "Habrá vocabulario nuevo.", en: "There will be new vocabulary."},

401: [
    {es: "Deberías habérmelo dicho.", en: "You should have told me."},

    {es: "Me enteré de ello a través de Juana.", en: "I learned about it through jane."},

    {es: "¿Cómo te pasó eso?", en: "How did that happen to you?"},
    {es: "¿Cuándo dejarás el hospital?", en: "When will you leave the hospital?"},
    {es: "Si pudiera pagarlo, te llevaría a la Clínica Pérez.", en: "If I could pay for it. I'd take you to the Perez Clinic."},

    {es: "¡Vaya sorpresa!", en: "What a surprise!"},
    {es: "Tienes buen aspecto.", en: "You look good."},

    {es: "No hablemos de enfermedades.", en: "Let's not talk about illnesses."},
    {es: "Me deprimen.", en: "They depress me."},

    {es: "¡Venga, anímate!", en: "Come on, cheer up!"},

    {es: "Depende de qué verbos practiquemos.", en: "It depends on what verbs we practice."},

    {es: "No hemos visto el condicional.", en: "We haven't seen the conditional."},
    {es: "Pero el condicional es sencillo.", en: "But the conditional is simple."},
    {es: "Quizás lo es para ti.", en: "Maybe it is for you."},
    {es: "Y para ti también.", en: "And for you too."},
    {es: "Me lío con ese tiempo del verbo.", en: "I get mixed up with that verb tense."},
    {es: "Bueno, si te empeñas.", en: "Okay, if you insist."},
    {es: "Te veo cansado.", en: "You look tired."},
    {es: "¿Y tú no después de lo que he hecho yo?", en: "And wouldn't you after what I've done?"},

    {es: "Acabo de terminar de escribir más de 4.000 frases.", en: "I've just finished writing more than 4,000 sentences."},
    {es: "¿Qué quieres decir?", en: "What do you mean?"},
    {es: "Quiero decir que todo hasta ahora ha sido fácil para mí.", en: "I mean that everything up to now has been easy for me."},
    {es: "Te crees muy listo.", en: "You think you're real smart."},
    {es: "Fallé muy pocos en el libro 3.", en: "I missed very few in book 3."},

    {es: "Quiero algo que me empuje.", en: "I want something to push me."},

    {es: "Vale, tú te lo estás buscando.", en: "Okay, you're asking for it."}
